# Tự động/thủ công deploy lên Cloudflare Workers + Static Assets.
#
# Cần khai báo trong repo Settings -> Secrets and variables -> Actions:
#   CLOUDFLARE_API_TOKEN   — token Cloudflare Workers
#   CLOUDFLARE_ACCOUNT_ID  — Account ID
name: Deploy lên Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trien-khai:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js theo .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Build Production
        run: npm run build

      - name: Deploy qua Cloudflare Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
