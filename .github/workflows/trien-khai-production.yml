# Triển khai production THỦ CÔNG — không chạy khi push hay PR (AGENTS.md: "Không GitHub CI trên PR / push").
# Chạy: GitHub → Actions → "Triển khai production" → Run workflow (nhánh main).
# Quality gate (typecheck, lint, test, build) chạy ở máy trước khi merge; ở đây chỉ: migration → guard → build → deploy → smoke.
#
# Cần khai báo MỘT LẦN: Settings → Secrets and variables → Actions → New repository secret
#   CLOUDFLARE_API_TOKEN — token của tài khoản Cloudflare bfc647e65d847f61ca386b7f11c27173
#                          (mẫu "Edit Cloudflare Workers", thêm quyền Account → D1 → Edit).

name: Triển khai production

on:
  workflow_dispatch:
    inputs:
      ap_dung_migration:
        description: 'Có migration D1 mới: áp dụng lên D1 production TRƯỚC khi deploy Worker'
        type: boolean
        default: false
      chi_kiem_tra:
        description: 'Chỉ kiểm tra production (smoke + phiên bản đang chạy), KHÔNG deploy'
        type: boolean
        default: false

concurrency:
  group: trien-khai-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trien-khai:
    # Chỉ phát hành từ main (scripts/guard-production-release.mjs cũng chặn nhánh khác).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: bfc647e65d847f61ca386b7f11c27173
      EXPECTED_RELEASE_SHA: ${{ github.sha }}
      URL_WORKER: https://gdtxdinhquan.ledinhphat1994.workers.dev
      URL_TEN_MIEN: https://gdtxdinhquan.com

    steps:
      - name: Kiểm tra token Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Chưa có secret CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions). Không deploy."
            exit 1
          fi

      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js theo .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Migration D1 (bắt buộc trước khi deploy Worker)
        if: ${{ !inputs.chi_kiem_tra }}
        env:
          AP_DUNG: ${{ inputs.ap_dung_migration }}
        run: |
          kiem_tra() {
            local db="$1"
            local out
            out=$(npx wrangler d1 migrations list "$db" --remote --config wrangler.production.jsonc 2>&1) || { echo "$out"; exit 1; }
            echo "$out"
            if echo "$out" | grep -q "No migrations to apply"; then
              echo "✅ $db: không có migration đang chờ."
              return 0
            fi
            if [ "$AP_DUNG" != "true" ]; then
              echo "::error::$db có migration đang chờ. Chạy lại với 'ap_dung_migration' = true để áp dụng trước khi deploy."
              exit 1
            fi
            npx wrangler d1 migrations apply "$db" --remote --config wrangler.production.jsonc
          }
          kiem_tra lop-10a7-db
          kiem_tra lop-10a7-analytics

      - name: Deploy (release guard + build + wrangler deploy)
        if: ${{ !inputs.chi_kiem_tra }}
        run: |
          set -o pipefail
          # Log ghi ra ngoài repo: release guard từ chối working tree có tệp lạ.
          npm run deploy:production 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          PHIEN_BAN=$(grep -oE 'Current Version ID: [0-9a-f-]+' "$RUNNER_TEMP/deploy.log" | tail -1 | sed 's/Current Version ID: //')
          {
            echo "### Đã deploy production"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Cloudflare Version ID: \`${PHIEN_BAN:-không đọc được}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        run: |
          loi=0
          kiem() {
            local url="$1" mong="$2"
            local ma
            ma=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url")
            if [ "$ma" = "$mong" ]; then echo "✅ $url → $ma"; else echo "::error::$url → $ma (mong đợi $mong)"; loi=1; fi
          }
          kiem "$URL_WORKER/" 200
          kiem "$URL_WORKER/learn" 200
          kiem "$URL_WORKER/api/whoami" 401
          kiem "$URL_WORKER/api/login" 405
          kiem "$URL_WORKER/api/game/highscores?gameType=solo_snake&verifiedOnly=1" 200
          # Tên miền riêng phải phục vụ ĐÚNG bản vừa deploy: trang chủ trỏ cùng gói JS với workers.dev.
          # (Không chặn job vì Worker đã lên; gắn tên miền nằm ngoài mã nguồn — chỉ cảnh báo.)
          goi_js() { curl -s --max-time 20 "$1/" | grep -oE '/assets/index-[A-Za-z0-9_-]+[.]js' | head -n 1; }
          js_worker=$(goi_js "$URL_WORKER")
          js_ten_mien=$(goi_js "$URL_TEN_MIEN")
          echo "Gói JS workers.dev: ${js_worker:-không đọc được} | $URL_TEN_MIEN: ${js_ten_mien:-không đọc được}"
          if [ -n "$js_worker" ] && [ "$js_worker" = "$js_ten_mien" ]; then
            echo "✅ $URL_TEN_MIEN đang phục vụ đúng bản vừa deploy ($js_worker)."
            echo "- ✅ $URL_TEN_MIEN phục vụ đúng bản đang chạy trên Worker (\`$js_worker\`)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::$URL_TEN_MIEN chưa phục vụ bản trên Worker gdtxdinhquan (tên miền chưa gắn hoặc đang trỏ nơi khác)."
            echo "- ⚠️ $URL_TEN_MIEN: gói JS \`${js_ten_mien:-?}\` khác Worker \`${js_worker:-?}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $loi

      - name: Các lần deploy gần nhất (để rollback nếu cần)
        if: ${{ always() }}
        run: |
          npx wrangler deployments list --json --config wrangler.production.jsonc > "$RUNNER_TEMP/deployments.json" || exit 0
          node -e '
            const ds = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const dong = (Array.isArray(ds) ? ds : []).sort((a, b) => String(b.created_on).localeCompare(String(a.created_on))).slice(0, 5).map((d) => {
              const bans = (d.versions || []).map((v) => `${v.version_id} (${v.percentage}%)`).join(", ");
              const tin = (d.annotations && d.annotations["workers/message"]) || "";
              return `- ${d.created_on} · ${bans}${tin ? " · " + tin : ""}`;
            });
            console.log(dong.join("\n"));
          ' "$RUNNER_TEMP/deployments.json" | tee -a "$GITHUB_STEP_SUMMARY"
