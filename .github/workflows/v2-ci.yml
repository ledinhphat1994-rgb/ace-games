# CI tự động kiểm tra chất lượng mã nguồn: Typecheck -> Lint -> Vitest -> Vite Build.
name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js theo .node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Kiểm tra kiểu TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (Vitest trong Workers runtime)
        run: npm test

      - name: Build Production Bundle
        run: npm run build
