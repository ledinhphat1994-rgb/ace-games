# Kiểm tra tự động cho bản rebuild v2 — chỉ kiểm tra, không deploy, không cần secret.
name: v2 CI

on:
  push:
    branches: [rebuild-v2]
    paths: ['v2/**', '.github/workflows/v2-ci.yml']
  pull_request:
    paths: ['v2/**', '.github/workflows/v2-ci.yml']

permissions:
  contents: read

concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js theo v2/.node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: v2/.node-version
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Cài thư viện
        run: npm ci

      - name: Kiểm tra kiểu TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (Vitest trong Workers runtime)
        run: npm test

      - name: Build
        run: npm run build
