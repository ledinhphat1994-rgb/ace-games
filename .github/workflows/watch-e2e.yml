# Watch Together E2E Acceptance Workflow (Staging Only)
name: Watch Together E2E Acceptance

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target Base URL for E2E (Must be Staging or Preview; Production strictly prohibited)'
        required: false
        default: 'https://gdtxdinhquan-v2.ledinhphat1994.workers.dev'

permissions:
  contents: read

concurrency:
  group: watch-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watch-e2e:
    name: Watch Together Multi-Browser Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium & system deps
        run: npx playwright install --with-deps chromium

      - name: Run Watch Together Acceptance Suite
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || 'https://gdtxdinhquan-v2.ledinhphat1994.workers.dev' }}
          E2E_HOST_USERNAME: ${{ secrets.E2E_HOST_USERNAME || 'qa.v2.thu1' }}
          E2E_HOST_PASSWORD: ${{ secrets.E2E_HOST_PASSWORD }}
          E2E_MEMBER_B_USERNAME: ${{ secrets.E2E_MEMBER_B_USERNAME || 'qa.v2.thu2' }}
          E2E_MEMBER_B_PASSWORD: ${{ secrets.E2E_MEMBER_B_PASSWORD }}
          E2E_MEMBER_C_USERNAME: ${{ secrets.E2E_MEMBER_C_USERNAME || 'qa.v2.thu3' }}
          E2E_MEMBER_C_PASSWORD: ${{ secrets.E2E_MEMBER_C_PASSWORD }}
          E2E_PUBLIC_ROOM_ID: ${{ secrets.E2E_PUBLIC_ROOM_ID || 'phong-7' }}
          E2E_PASSWORD_ROOM_ID: ${{ secrets.E2E_PASSWORD_ROOM_ID || 'phong-8' }}
          E2E_PASSWORD_ROOM_PASSWORD: ${{ secrets.E2E_PASSWORD_ROOM_PASSWORD }}
        run: npm run test:e2e:watch

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
