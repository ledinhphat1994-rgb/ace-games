<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="refresh" content="0; url=/?auth=login">
<title>Đang chuyển hướng về cổng đăng nhập...</title>
<script>
  (function() {
    var url = new URL(window.location.href);
    var next = url.searchParams.get('next') || '';
    var lyDo = url.searchParams.get('lyDo') || '';
    var tab = url.searchParams.get('tab') || 'dang-nhap';
    var target = '/?auth=' + (tab === 'dang-ky' ? 'register' : 'login');
    if (next) target += '&next=' + encodeURIComponent(next);
    if (lyDo) target += '&lyDo=' + encodeURIComponent(lyDo);
    window.location.replace(target);
  })();
</script>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #071624;
    color: #94a3b8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .redirect-box {
    text-align: center;
    padding: 24px;
  }
  .spinner {
    display: inline-block;
    width: 32px;
    height: 32px;
    border: 3px solid rgba(0, 242, 254, 0.2);
    border-top-color: #00f2fe;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  a { color: #00f2fe; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="redirect-box">
  <div class="spinner"></div>
  <p>Đang chuyển hướng tới cổng đăng nhập Digital Campus…</p>
  <p><a href="/?auth=login">Bấm vào đây nếu trình duyệt không tự chuyển hướng</a></p>
</div>
</body>
</html>
