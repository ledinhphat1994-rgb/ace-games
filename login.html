<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#071624">
<title>Đăng nhập hệ thống lớp học</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/quan-ly.css">
</head>
<body class="trang-dang-nhap">

<header class="thanh-tren">
  <div class="wrap">
    <a class="hieu" href="/">
      <span class="hieu-o" id="hieuMaLop">🎓</span>
      <span class="hieu-ten"><span id="hieuTenLop">Hệ thống lớp học</span><small class="hieu-phu">Đăng nhập</small></span>
    </a>
    <div class="thanh-phai">
      <a class="nut-tron" href="/" title="Trang chủ" aria-label="Trang chủ">
        <svg class="bieu-tuong-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
      </a>
      <button class="nut-tron" id="nutNhac" aria-label="Bật nhạc nền" aria-pressed="false" title="Nhạc nền" hidden><svg class="bieu-tuong-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
      <button class="nut-tron nut-theme-bg" id="nutThemeBg" aria-label="Tùy chỉnh hình nền & chủ đề" title="Đổi màu nền & chủ đề">
        <svg class="bieu-tuong-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
      </button>
      <button class="nut-tron" id="doiGiaoDien" aria-label="Đổi giao diện sáng tối" title="Sáng / tối"><svg class="bieu-tuong-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
    </div>
  </div>
</header>

<main class="the-dang-nhap">
  <div class="hieu-o" id="hieuOChinh">🎓</div>
  <h1 id="tieuDeDangNhap">Chọn lớp của em</h1>
  <p class="phu" id="phuDeDangNhap">Chạm vào đúng lớp của mình để tiếp tục</p>

  <!-- Bước 1: chọn lớp (chỉ hiện khi vào thẳng / mà không kèm ?lop=, và có từ 2 lớp trở lên). -->
  <div id="chonLop" style="display:none;flex-direction:column;gap:10px;margin:18px 0;" hidden></div>

  <!-- Bước 2: nhập mã — ẩn cho tới khi đã biết đang vào lớp nào. -->
  <form id="bieuMau" autocomplete="off" hidden>
    <button type="button" id="nutDoiLop" class="nut-nhe nut-nho" style="margin-bottom:10px;" hidden>‹ Chọn lại lớp khác</button>
    <label class="nhan-nhap" for="ma">Mã cá nhân của em (hoặc mã giáo viên)</label>
    <input class="o-nhap" id="ma" name="ma" type="password"
           placeholder="Nhập mã cá nhân giáo viên chủ nhiệm đã cấp" required autofocus
           autocapitalize="none" autocorrect="off" spellcheck="false">
    <button class="nut" type="submit" id="nutGui">Vào trang lớp</button>
  </form>

  <p class="loi-nhan xau" id="loiNhan" hidden></p>

  <p class="ghi-chu-dang-nhap">
    Trang dành riêng cho học sinh và giáo viên chủ nhiệm đã được cấp mã.
    Mỗi em dùng đúng mã cá nhân của mình — đừng đưa mã cho bạn khác.
    Quên mã thì liên hệ trực tiếp giáo viên chủ nhiệm.
  </p>
</main>

<script type="module">
  import { ganDoiGiaoDien } from '/assets/js/chung.js';
  ganDoiGiaoDien(document.getElementById('doiGiaoDien'));

  // Đăng nhập giờ có 2 BƯỚC khi vào thẳng "/" (không kèm ?lop=): (1) chọn đúng lớp trong danh
  // sách công khai (chỉ tên lớp, không phải cơ chế bảo mật), (2) nhập mã của đúng lớp đó. Mở
  // thẳng link riêng của một lớp (?lop=<slug>) thì bỏ qua bước 1, vào ngay bước 2.
  const chonLop = document.getElementById('chonLop');
  const bieuMau = document.getElementById('bieuMau');
  const nutDoiLop = document.getElementById('nutDoiLop');

  function apDungThuongHieu(lop) {
    const tenNgan = (lop.ten || '').replace(/^Lớp\s*/i, '');
    document.title = `Đăng nhập · ${lop.ten}`;
    document.getElementById('hieuTenLop').textContent = lop.ten;
    document.getElementById('hieuMaLop').textContent = tenNgan || '🎓';
    document.getElementById('tieuDeDangNhap').textContent = lop.ten;
    document.getElementById('hieuOChinh').textContent = tenNgan || '🎓';
    document.getElementById('phuDeDangNhap').textContent = lop.truong || '';
  }

  // Giữ nguyên "next" (trang định vào trước khi bị bắt đăng nhập lại) khi đổi URL sang dạng
  // ?lop=... — không thì đăng nhập xong sẽ bị đưa về trang mặc định thay vì đúng trang đang xem dở.
  function datThamSoLop(slug) {
    const qs = new URLSearchParams(location.search);
    qs.set('lop', slug);
    history.replaceState(null, '', '?' + qs.toString());
  }

  // Lưu ý: #chonLop có style="display:flex" cố định để xếp các nút theo cột — thuộc tính
  // "hidden" một mình không thắng nổi display:flex đã đặt sẵn (inline style luôn thắng), nên
  // MỌI LẦN ẩn/hiện đều phải đặt lại .style.display tường minh, không chỉ đổi .hidden.
  function hienChonLop(hien) {
    chonLop.hidden = !hien;
    chonLop.style.display = hien ? 'flex' : 'none';
  }

  function moBuocNhapMa(slug, lop, coTheDoiLop) {
    if (lop) apDungThuongHieu(lop);
    if (slug) datThamSoLop(slug);
    hienChonLop(false);
    bieuMau.hidden = false;
    nutDoiLop.hidden = !coTheDoiLop;
    document.getElementById('ma').focus();
  }

  function moBuocChonLop(danhSach) {
    document.getElementById('hieuTenLop').textContent = 'Hệ thống lớp học';
    document.getElementById('hieuMaLop').textContent = '🎓';
    document.getElementById('hieuOChinh').textContent = '🎓';
    document.getElementById('tieuDeDangNhap').textContent = 'Chọn lớp của em';
    document.getElementById('phuDeDangNhap').textContent = 'Chạm vào đúng lớp của mình để tiếp tục';
    document.title = 'Chọn lớp — Đăng nhập';
    chonLop.innerHTML = '';
    danhSach.forEach((lop) => {
      const nut = document.createElement('button');
      nut.type = 'button';
      nut.className = 'nut nut-vien nut-rong';
      nut.textContent = lop.ten;
      nut.addEventListener('click', () => moBuocNhapMa(lop.slug, lop, true));
      chonLop.append(nut);
    });
    hienChonLop(true);
    bieuMau.hidden = true;
  }

  nutDoiLop.addEventListener('click', () => {
    const qs = new URLSearchParams(location.search);
    qs.delete('lop');
    history.replaceState(null, '', location.pathname + (qs.toString() ? '?' + qs.toString() : ''));
    khoiDongTrang();
  });

  async function khoiDongTrang() {
    const slug = new URLSearchParams(location.search).get('lop');

    if (slug) {
      try {
        const d = await fetch('/api/lop-cong-khai?lop=' + encodeURIComponent(slug)).then((r) => r.json());
        if (d.ok && d.lop) return moBuocNhapMa(slug, d.lop, true);
      } catch { /* rơi xuống bước chọn lớp nếu tra không được */ }
    }

    try {
      const d = await fetch('/api/lop-cong-khai').then((r) => r.json());
      const danhSach = (d.ok && d.danhSach) || [];
      if (danhSach.length === 1) return moBuocNhapMa(danhSach[0].slug, danhSach[0], false);
      if (danhSach.length > 1) return moBuocChonLop(danhSach);
    } catch { /* không tra được danh sách lớp — vẫn cho nhập mã chung chung bên dưới */ }

    // Không có slug, không tra được lớp nào — vẫn mở form nhập mã chung chung để không chặn
    // đường vào của bất kỳ ai (đăng nhập vẫn luôn dựa vào chính mã nhập, không phụ thuộc bước này).
    document.getElementById('tieuDeDangNhap').textContent = 'Đăng nhập';
    document.getElementById('phuDeDangNhap').textContent = 'Dành cho học sinh và giáo viên chủ nhiệm đã được cấp mã';
    hienChonLop(false);
    bieuMau.hidden = false;
  }
  khoiDongTrang();

  const loiNhan = document.getElementById('loiNhan');
  const nutGui = document.getElementById('nutGui');

  function hien(chu, kieu) {
    loiNhan.textContent = chu;
    loiNhan.className = 'loi-nhan ' + kieu;
    loiNhan.hidden = false;
  }

  bieuMau.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    loiNhan.hidden = true;
    nutGui.disabled = true;
    nutGui.textContent = 'Đang kiểm tra…';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: document.getElementById('ma').value })
      });
      const d = await res.json();

      if (d.ok) {
        try {
          const maNhap = document.getElementById('ma').value.trim();
          if (maNhap) localStorage.setItem('maCaNhan', maNhap);
        } catch { /* bỏ qua nếu bị chặn */ }
        hien('Xác thực thành công. Đang mở trang…', 'tot');
        const tiep = new URLSearchParams(location.search).get('next');
        const laKhuGiaoVien = d.role === 'teacher' || d.role === 'phu';
        location.href = (tiep && tiep.startsWith('/')) ? tiep : (laKhuGiaoVien ? '/giao-vien/' : '/');
        return;
      }
      hien(d.message || 'Mã bảo mật không đúng.', 'xau');
    } catch {
      hien('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.', 'xau');
    }

    nutGui.disabled = false;
    nutGui.textContent = 'Vào trang lớp';
  });
</script>
</body>
</html>
