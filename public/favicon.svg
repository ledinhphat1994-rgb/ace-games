<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient chuẩn Cyber Deep Sky -->
    <linearGradient id="dc-tab-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1d36" />
      <stop offset="50%" stop-color="#091528" />
      <stop offset="100%" stop-color="#050e1c" />
    </linearGradient>

    <!-- Bevel Highlight phản quang cạnh trên -->
    <linearGradient id="dc-tab-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Gradient chữ A nhận diện thương hiệu -->
    <linearGradient id="dc-tab-a" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Ánh sáng gân phản quang dọc đỉnh chữ A -->
    <linearGradient id="dc-tab-shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15" />
    </linearGradient>

    <!-- Bộ lọc phát sáng nhẹ nhàng cho favicon -->
    <filter id="dc-tab-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Khung Squircle bo góc chuẩn icon mobile -->
  <rect x="3" y="3" width="94" height="94" rx="23" fill="url(#dc-tab-bg)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.75" />

  <!-- Lớp viền phản quang trên -->
  <path d="M 7 26 C 7 15 15 7 26 7 L 74 7 C 85 7 93 15 93 26 L 93 40 C 60 45 40 45 7 40 Z" fill="url(#dc-tab-bevel)" />

  <!-- Biểu tượng chữ A cách điệu đặc trưng (không có dấu chấm tròn) -->
  <path
    d="M50 16C43.5 16 35.8 28.5 28.5 44.5C21.8 59.2 17.5 73.2 18.2 78.4C18.8 82.5 22.8 84.5 26.8 82.8C32.5 80.4 39.5 70.8 44.2 60.5C46.8 54.8 48.8 49.8 50 49.8C51.2 49.8 53.2 54.8 55.8 60.5C60.5 70.8 67.5 80.4 73.2 82.8C77.2 84.5 81.2 82.5 81.8 78.4C82.5 73.2 78.2 59.2 71.5 44.5C64.2 28.5 56.5 16 50 16Z"
    fill="url(#dc-tab-a)"
    filter="url(#dc-tab-glow)"
  />

  <!-- Đường gân phản quang tăng chiều sâu 3D -->
  <path
    d="M50 20C47.2 20 42.8 28.2 37.8 40.2C33.2 51.5 29.5 63 29.8 68.2C32.8 66 37.8 58.2 42 49.5C45.2 42.8 48.2 36.8 50 36.8C51.8 36.8 54.8 42.8 58 49.5C62.2 58.2 67.2 66 70.2 68.2C70.5 63 66.8 51.5 62.2 40.2C57.2 28.2 52.8 20 50 20Z"
    fill="url(#dc-tab-shine)"
    opacity="0.8"
  />
</svg>