# Cấu hình Cloudflare Pages cho web quản lý nhiều lớp (GDTX Định Quán).
# Tài khoản được khoá cứng trong deploy.js (biến CLOUDFLARE_ACCOUNT_ID),
# vì cấu hình Pages không cho khai báo account_id ở đây.
#
# "name" quyết định địa chỉ *.pages.dev — Cloudflare KHÔNG cho đổi tên này sau khi đã tạo
# project (xác nhận từ tài liệu chính thức, 2026-09), nên đổi "name" ở đây và deploy lại sẽ
# TẠO MỘT PROJECT MỚI (project "lop-10a7" cũ vẫn còn nguyên, không tự xoá) chứ không đổi tên
# project hiện có. D1/R2/KV vẫn dùng chung ĐÚNG các tài nguyên bên dưới — không tạo dữ liệu mới.
name = "gdtxdinhquan"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-03"

# Cơ sở dữ liệu của lớp: học sinh, điểm danh, nhật ký, thông báo.
[[d1_databases]]
binding = "DB"
database_name = "lop-10a7-db"
database_id = "a12de014-e9d2-4d6d-994f-dcb36c481432"

# Giới hạn số lần nhập sai mã, chống dò mã tự động.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "e2529ac570cb4d77a246f38953dcbc9f"

# Kho lưu trữ ảnh hoạt động và nhạc nền của lớp (Cloudflare R2 - 10 GB miễn phí).
[[r2_buckets]]
binding = "ANH"
bucket_name = "lop-10a7-anh"
