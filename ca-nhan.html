<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17558f">
<title>Kết quả của tôi · Lớp 10A7</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/quan-ly.css">
</head>
<body>

<header class="thanh-tren">
  <div class="wrap">
    <a class="hieu" href="/">
      <span class="hieu-o">10A7</span>
      <span class="hieu-ten">Kết quả của tôi<small class="hieu-phu">Lớp 10A7 · 2026 – 2027</small></span>
    </a>
    <div class="thanh-phai">
      <button class="nut-tron" id="doiGiaoDien" aria-label="Đổi giao diện sáng tối" title="Sáng / tối">◐</button>
      <a class="nut-tron" href="/" title="Về trang lớp" aria-label="Về trang lớp">↩</a>
    </div>
  </div>
</header>

<main class="wrap" id="noiDung" style="padding-top:20px;padding-bottom:40px">

  <div class="the" id="khungNhapMa" style="max-width:460px;margin:0 auto">
    <h2 style="margin-bottom:6px">Xem kết quả của tôi</h2>
    <p class="trong" style="margin-bottom:16px">
      Nhập mã cá nhân giáo viên chủ nhiệm đã phát cho em. Em chỉ xem được kết quả của chính mình.
    </p>
    <label class="nhan-nhap" for="oMa">Mã cá nhân</label>
    <input class="o-nhap" id="oMa" type="text" placeholder="Ví dụ: KQBM47" maxlength="12"
           autocapitalize="characters" autocorrect="off" spellcheck="false"
           style="text-transform:uppercase;letter-spacing:2px;font-weight:700">
    <button class="nut nut-rong" id="nutXem" style="margin-top:14px">Xem kết quả</button>
    <p class="loi-nhan xau" id="loiNhan" hidden></p>
    <p class="trong" style="margin-top:16px;font-size:12.5px">
      Quên mã thì hỏi lại giáo viên chủ nhiệm. Đừng đưa mã cho bạn khác.
    </p>
  </div>

  <div id="khungKetQua" hidden></div>

</main>

<footer class="chan-trang">
  <div class="wrap">
    <span>Lớp 10A7 · GDNN – GDTX xã Định Quán, Đồng Nai</span>
    <span><a href="/">Về trang lớp</a></span>
  </div>
</footer>

<script type="module" src="/assets/js/ca-nhan.js"></script>
