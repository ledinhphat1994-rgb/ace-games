<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17558f">
<title>Kết quả của tôi · Lớp 10A7</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/quan-ly.css">
</head>
<body>

<header class="thanh-tren">
  <div class="wrap">
    <a class="hieu" href="/">
      <span class="hieu-o">10A7</span>
      <span class="hieu-ten">Kết quả của tôi<small class="hieu-phu">Lớp 10A7 · 2026 – 2027</small></span>
    </a>
    <div class="thanh-phai">
      <a class="nut-tron" href="/" title="Trang chủ" aria-label="Trang chủ">
        <svg class="bieu-tuong-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
      </a>
      <button class="nut-tron" id="nutNhac" aria-label="Bật nhạc nền" aria-pressed="false" title="Nhạc nền" hidden>♪</button>
      <button class="nut-tron nut-theme-bg" id="nutThemeBg" aria-label="Tùy chỉnh hình nền & chủ đề" title="Đổi màu nền & chủ đề">
        <svg class="bieu-tuong-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
      </button>
      <button class="nut-tron" id="doiGiaoDien" aria-label="Đổi giao diện sáng tối" title="Sáng / tối">◐</button>
    </div>
  </div>
</header>

<main class="wrap" id="noiDung" style="padding-top:20px;padding-bottom:40px">

  <div class="the" id="khungNhapMa" style="max-width:460px;margin:0 auto">
    <h2 style="margin-bottom:6px">Xem kết quả của tôi</h2>
    <p class="trong" style="margin-bottom:16px">
      Nhập mã cá nhân giáo viên chủ nhiệm đã phát cho em. Em chỉ xem được kết quả của chính mình.
    </p>
    <label class="nhan-nhap" for="oMa">Mã cá nhân</label>
    <input class="o-nhap" id="oMa" type="text" placeholder="Ví dụ: KQBM47 hoặc MinhAnh2011" maxlength="32"
           autocapitalize="none" autocorrect="off" spellcheck="false"
           style="letter-spacing:1.5px;font-weight:700">
    <button class="nut nut-rong" id="nutXem" style="margin-top:14px">Xem kết quả</button>
    <p class="loi-nhan xau" id="loiNhan" hidden></p>
    <p class="trong" style="margin-top:16px;font-size:12.5px">
      Quên mã thì hỏi lại giáo viên chủ nhiệm. Đừng đưa mã cho bạn khác.
    </p>
  </div>

  <div id="khungKetQua" hidden></div>

</main>

<footer class="chan-trang">
  <div class="wrap">
    <span>Lớp 10A7 · GDNN – GDTX xã Định Quán, Đồng Nai</span>
    <span><a href="/">Về trang lớp</a></span>
  </div>
</footer>

<audio id="nhacNenAudio" loop preload="none"></audio>

<script type="module" src="/assets/js/ca-nhan.js"></script>
</body>
</html>
