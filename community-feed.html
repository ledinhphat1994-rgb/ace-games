                content: text,
                time: 'Vừa xong'

          const userHeart = !p.reactions.userHeart;
          return {
            ...p,
            reactions: {
              ...p.reactions,
              heart: userHeart ? p.reactions.heart + 1 : Math.max(0, p.reactions.heart - 1),

                      className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-medium transition-all ${
                        ch.active
                          ? 'bg-gradient-to-r from-[#00F2FE]/15 to-[#8B5CF6]/10 text-[#00F2FE] border border-[#00F2FE]/30'
                          : 'text-slate-300 hover:bg-white/5 hover:text-white'
                      }`}
                    >
                      <div className="flex items-center gap-2.5">
                        <Icon name={ch.icon} className={`w-4 h-4 ${ch.active ? 'text-[#00F2FE]' : 'text-slate-400'}`} />
                        <span>{ch.name}</span>
                      </div>
                      {ch.isVoice ? (
                        <span className="text-[10px] text-emerald-400 font-mono bg-emerald-500/10 px-1.5 py-0.5 rounded border border-emerald-500/20">
                          {ch.members}
                        </span>
                      ) : ch.count ? (
                        <span className="bg-[#8B5CF6] text-white text-[10px] font-bold px-1.5 py-0.2 rounded-full">
                          {ch.count}
                        </span>
                      ) : null}
                    </button>
                  ))}
                </div>

                <div className="bg-gradient-to-r from-[#151A23] to-[#1a2230] border border-[#00F2FE]/20 rounded-2xl p-3.5 shadow-lg flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <div className="w-8 h-8 rounded-lg bg-[#00F2FE]/10 flex items-center justify-center text-[#00F2FE]">
                      <Icon name="headphones" className="w-4 h-4" />
                    </div>
                    <div>
                      <p className="text-xs font-semibold text-white">Lofi Study Room</p>
                      <p className="text-[10px] text-slate-400">5 bạn đang cùng học</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-0.5 h-4">
                    <span className="w-1 bg-[#00F2FE] h-2.5 rounded-full animate-bounce"></span>
                    <span className="w-1 bg-[#00F2FE] h-4 rounded-full animate-bounce [animation-delay:0.2s]"></span>
                    <span className="w-1 bg-[#00F2FE] h-1.5 rounded-full animate-bounce [animation-delay:0.4s]"></span>
                  </div>
                </div>
              </aside>

              {/* Center Feed */}
              <section className="w-full max-w-[640px] mx-auto flex flex-col gap-6">

                {/* Pinned Teacher Card */}
                <div className="bg-[#151A23] border border-[#FFB800]/40 rounded-2xl p-5 shadow-[0_0_24px_rgba(255,184,0,0.12)] relative overflow-hidden">
                  <div className="flex items-center justify-between mb-3">
                    <div className="flex items-center gap-3">
                      <img
                        src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&auto=format&fit=crop&q=80"
                        className="w-10 h-10 rounded-full object-cover ring-2 ring-[#FFB800]"
                      />
                      <div>
                        <div className="flex items-center gap-1.5">
                          <span className="font-bold text-sm text-white">Thầy Lê Đình Phát</span>
                          <Icon name="check" className="w-4 h-4 text-[#00F2FE]" />
                          <span className="text-[10px] bg-[#FFB800]/15 text-[#FFB800] px-2 py-0.5 rounded-full border border-[#FFB800]/30 font-semibold">
                            GVCN Lớp 10A7
                          </span>
                        </div>
                        <p className="text-[11px] text-slate-400">Đã ghim · 2 giờ trước</p>
                      </div>
                    </div>
                    <div className="flex items-center gap-1 text-xs text-[#FFB800] font-semibold bg-[#FFB800]/10 px-2.5 py-1 rounded-full border border-[#FFB800]/25">
                      <Icon name="pin" className="w-3.5 h-3.5" /> Ghim
                    </div>
                  </div>

                  <h3 className="text-sm font-bold text-white mb-2">
                    📢 KẾ HOẠCH ÔN TẬP GIỮA KỲ I & ĐĂNG KÝ HỘI THAO 2026
                  </h3>
                  <p className="text-xs text-slate-300 leading-relaxed mb-3">
                    Chào cả lớp 10A7! Thầy đã cập nhật đề cương ôn tập môn Toán và Ngữ Văn lên Study Hub. Các bạn chú ý thời hạn nộp bài tập tuần này vào trước 22:00 Chủ Nhật. Chúc cả lớp có một tuần học tập tràn đầy năng lượng! 🔥✨
                  </p>

                  <div className="flex items-center justify-between pt-3 border-t border-white/10 text-xs">
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => setPinnedItem(p => ({ ...p, heart: p.reacted.heart ? p.heart - 1 : p.heart + 1, reacted: { ...p.reacted, heart: !p.reacted.heart } }))}
                        className={`flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium transition-all ${
                          pinnedItem.reacted.heart ? 'bg-rose-500/20 text-rose-400 border border-rose-500/40' : 'bg-white/5 text-slate-300'
                        }`}
                      >
                        <Icon name="heart" className="w-3.5 h-3.5" />
                        <span>{pinnedItem.heart}</span>
                      </button>
                      <button className="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-[#00F2FE]/20 text-[#00F2FE] border border-[#00F2FE]/40">
                        <Icon name="sparkles" className="w-3.5 h-3.5" />
                        <span>{pinnedItem.sparkle}</span>
                      </button>
                    </div>
                    <span className="text-[11px] text-slate-400 flex items-center gap-1">
                      <Icon name="comment" className="w-3.5 h-3.5" /> 14 phản hồi
                    </span>
                  </div>
                </div>

                {/* Post Creator */}
                <div className="bg-[#151A23] border border-white/10 rounded-2xl p-4 shadow-xl">
                  <form onSubmit={handleCreatePost}>
                    <div className="flex items-start gap-3 mb-3">
                      {isIncognito ? (
                        <div className="w-10 h-10 rounded-full bg-[#8B5CF6]/20 border border-[#8B5CF6]/50 flex items-center justify-center text-[#8B5CF6]">
                          <Icon name="ghost" className="w-5 h-5 animate-pulse" />
                        </div>
                      ) : (
                        <img
                          src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&auto=format&fit=crop&q=80"
                          className="w-10 h-10 rounded-full ring-2 ring-white/10 object-cover"
                        />
                      )}
                      <textarea
                        value={composerText}
                        onChange={e => setComposerText(e.target.value)}
                        placeholder={isIncognito ? "Đang ở chế độ Ẩn danh. Viết điều bạn muốn chia sẻ..." : "Bạn đang nghĩ gì, 10A7-er? Đặt câu hỏi bài tập hoặc chia sẻ..."}
                        rows={3}
                        className="flex-1 bg-[#0B0E14]/60 border border-white/10 rounded-xl p-3 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-[#00F2FE] resize-none"
                      />
                    </div>

                    <div className="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-white/5">
                      <div className="flex items-center gap-1.5">
                        <button type="button" className="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-white/5 text-slate-300 text-xs">
                          <Icon name="image" className="w-3.5 h-3.5 text-[#00F2FE]" /> Ảnh
                        </button>
                        <button type="button" className="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-white/5 text-slate-300 text-xs">
                          <Icon name="mic" className="w-3.5 h-3.5 text-[#8B5CF6]" /> Audio
                        </button>
                        <button type="button" className="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-white/5 text-slate-300 text-xs">
                          <Icon name="chart" className="w-3.5 h-3.5 text-emerald-400" /> Bình chọn
                        </button>
                      </div>

                      <div className="flex items-center gap-3 ml-auto">
                        <label className="flex items-center gap-1.5 cursor-pointer text-xs">
                          <input
                            type="checkbox"
                            checked={isIncognito}
                            onChange={e => setIsIncognito(e.target.checked)}
                            className="w-4 h-4 accent-[#8B5CF6]"
                          />
                          <span className={`text-[11px] font-medium ${isIncognito ? 'text-[#8B5CF6]' : 'text-slate-400'}`}>
                            Ẩn danh
                          </span>
                        </label>

                        <button
                          type="submit"
                          disabled={!composerText.trim()}
                          className="flex items-center gap-1 px-4 py-1.5 rounded-xl bg-gradient-to-r from-[#00F2FE] to-[#8B5CF6] text-black font-bold text-xs disabled:opacity-40"
                        >
                          <Icon name="send" className="w-3.5 h-3.5" /> Đăng bài
                        </button>
                      </div>
                    </div>
                  </form>
                </div>

                {/* Feed Posts */}
                <div className="flex flex-col gap-4">
                  {posts.map(post => (
                    <article key={post.id} className="bg-[#151A23] border border-white/10 rounded-2xl p-5 shadow-xl">
                      <div className="flex items-start justify-between mb-3">
                        <div className="flex items-center gap-3">
                          {post.isIncognito ? (
                            <div className="w-10 h-10 rounded-full bg-[#8B5CF6]/20 border border-[#8B5CF6]/40 flex items-center justify-center text-[#8B5CF6]">
                              <Icon name="ghost" className="w-5 h-5" />
                            </div>
                          ) : (
                            <img src={post.avatar} className="w-10 h-10 rounded-full object-cover ring-2 ring-white/10" />
                          )}
                          <div>
                            <div className="flex items-center gap-1.5">
                              <span className="font-bold text-sm text-white">{post.author}</span>
                            </div>
                            <p className="text-[11px] text-slate-400">{post.role} • {post.time}</p>
                          </div>
                        </div>
                      </div>

                      <p className="text-xs text-slate-200 leading-relaxed mb-3 whitespace-pre-line">{post.content}</p>

                      <div className="flex flex-wrap gap-1.5 mb-4">
                        {post.tags.map((t, i) => (
                          <span key={i} className="text-[11px] text-[#00F2FE] bg-[#00F2FE]/5 px-2 py-0.5 rounded-md border border-[#00F2FE]/15">
                            {t}
                          </span>
                        ))}
                      </div>

                      <div className="flex items-center justify-between pt-3 border-t border-white/10 text-xs">
                        <button
                          onClick={() => toggleHeart(post.id)}
                          className={`flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium transition-all ${
                            post.reactions.userHeart ? 'bg-rose-500/20 text-rose-400 border border-rose-500/40' : 'bg-white/5 text-slate-300'
                          }`}
                        >
                          <Icon name="heart" className="w-3.5 h-3.5" />
                          <span>{post.reactions.heart}</span>
                        </button>
                        <span className="text-slate-400 flex items-center gap-1">
                          <Icon name="comment" className="w-3.5 h-3.5" /> {post.comments.length}
                        </span>
                      </div>

                      {/* Comments list */}
                      {post.comments.length > 0 && (
                        <div className="mt-4 pt-4 border-t border-white/5 flex flex-col gap-2.5">
                          {post.comments.map(c => (
                            <div key={c.id} className={`flex items-start gap-2.5 p-2.5 rounded-xl ${c.isTeacher ? 'bg-[#FFB800]/5 border border-[#FFB800]/20' : 'bg-[#0B0E14]/50'}`}>
                              <img src={c.avatar} className="w-7 h-7 rounded-full object-cover shrink-0" />
                              <div className="flex-1 text-xs">
                                <div className="flex items-center gap-1 mb-1">
                                  <span className="font-semibold text-white">{c.author}</span>
                                  {c.isTeacher && <span className="text-[9px] bg-[#FFB800]/20 text-[#FFB800] px-1.5 py-0.2 rounded font-bold">Giáo viên</span>}
                                  <span className="text-[10px] text-slate-500">• {c.time}</span>
                                </div>
                                <p className="text-slate-300">{c.content}</p>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}

                      {/* Add comment */}
                      <div className="flex items-center gap-2 mt-3">
                        <input
                          type="text"
                          value={commentInputs[post.id] || ''}
                          onChange={e => setCommentInputs({ ...commentInputs, [post.id]: e.target.value })}
                          onKeyDown={e => e.key === 'Enter' && handleAddComment(post.id)}
                          placeholder="Viết phản hồi..."
                          className="flex-1 bg-[#0B0E14] border border-white/10 rounded-xl px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-[#00F2FE]"
                        />
                        <button
                          onClick={() => handleAddComment(post.id)}
                          className="p-2 rounded-xl bg-[#00F2FE]/10 text-[#00F2FE] border border-[#00F2FE]/30"
                        >
                          <Icon name="send" className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    </article>
                  ))}
                </div>
              </section>

              {/* Right Sidebar */}
              <aside className="hidden lg:flex flex-col gap-5 sticky top-24 h-[calc(100vh-7rem)] overflow-y-auto">
                {/* Mini player */}
                <div className="bg-[#151A23] border border-white/10 rounded-2xl p-4 shadow-xl">
                  <div className="flex items-center justify-between mb-3">
                    <div className="flex items-center gap-2 text-xs font-bold text-white">
                      <Icon name="music" className="w-4 h-4 text-[#00F2FE]" />
                      <span>Lofi Study Room 🎧</span>
                    </div>
                    <span className="text-[10px] text-emerald-400 font-mono bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">LIVE</span>
                  </div>

                  <div className="flex items-center gap-3 mb-3">
                    <img
                      src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=120&auto=format&fit=crop&q=80"
                      className="w-12 h-12 rounded-xl object-cover"
                    />
                    <div>
                      <h4 className="text-xs font-bold text-white">Midnight Study Beats</h4>
                      <p className="text-[11px] text-slate-400">Lofi Girl x 10A7 Radio</p>
                    </div>
                  </div>

                  {/* Frequency bars */}
                  <div className="flex items-end justify-between gap-1 h-6 mb-3 px-1">
                    {[14, 24, 18, 28, 12, 22, 16, 26, 20, 15, 24, 18].map((val, idx) => (
                      <span
                        key={idx}
                        style={{ height: isPlaying ? `${Math.max(4, (val * (audioProgress % 4 + 1)) % 24)}px` : '4px' }}
                        className="flex-1 bg-gradient-to-t from-[#00F2FE] to-[#8B5CF6] rounded-full transition-all duration-300"
                      ></span>
                    ))}
                  </div>

                  <div className="flex items-center justify-between text-slate-300">
                    <span className="text-[10px] font-mono text-slate-400">01:42</span>
                    <button
                      onClick={() => setIsPlaying(!isPlaying)}
                      className="w-9 h-9 rounded-full bg-[#00F2FE] text-black flex items-center justify-center shadow-[0_0_12px_rgba(0,242,254,0.4)]"
                    >
                      <Icon name={isPlaying ? "pause" : "play"} className="w-4 h-4 fill-black" />
                    </button>
                    <span className="text-[10px] font-mono text-slate-400">03:45</span>
                  </div>
                </div>

                {/* Daily Quiz & Streak */}
                <div className="bg-[#151A23] border border-white/10 rounded-2xl p-4 shadow-xl flex flex-col gap-3">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2 text-xs font-bold text-white">
                      <Icon name="flame" className="w-4 h-4 text-[#FFB800]" />
                      <span>Đố vui & Streak 10A7</span>
                    </div>
                    <span className="text-[10px] text-[#FFB800] font-semibold">Top 3</span>
                  </div>

                  <div className="p-3 rounded-xl bg-[#0B0E14]/70 border border-white/5">
                    <p className="text-xs font-medium text-slate-200 mb-2">
                      ❓ Công thức liên hệ vận tốc, gia tốc và quãng đường (chuyển động biến đổi đều)?
                    </p>
                    <button
                      onClick={() => setTriviaDone(true)}
                      className={`w-full text-[11px] px-2.5 py-1.5 rounded-lg border text-left font-mono transition-all ${
                        triviaDone ? 'bg-emerald-500/20 border-emerald-400 text-emerald-300' : 'bg-white/5 border-white/5 text-slate-300'
                      }`}
                    >
                      v² - v₀² = 2as {triviaDone && '✓ Chính xác (+50đ)'}
                    </button>
                  </div>

                  <div className="flex flex-col gap-2">
                    {[
                      { name: 'Phan Quốc Bảo', streak: 28, rank: 1, avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&auto=format&fit=crop&q=80' },
                      { name: 'Nguyễn Minh Thư', streak: 21, rank: 2, avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100&auto=format&fit=crop&q=80' },
                      { name: 'Đặng Tuấn Kiệt', streak: 18, rank: 3, avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&auto=format&fit=crop&q=80' }
                    ].map(st => (
                      <div key={st.rank} className="flex items-center justify-between p-2 rounded-xl bg-white/5">
                        <div className="flex items-center gap-2">
                          <span className="w-5 h-5 rounded-full bg-[#FFB800] text-black flex items-center justify-center text-[10px] font-bold">
                            {st.rank}
                          </span>
                          <img src={st.avatar} className="w-7 h-7 rounded-full object-cover" />
                          <span className="text-xs text-slate-200">{st.name}</span>
                        </div>
                        <span className="text-xs font-bold text-[#FFB800] flex items-center gap-1">
                          <Icon name="flame" className="w-3.5 h-3.5" /> {st.streak} ngày
                        </span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Online members */}
                <div className="bg-[#151A23] border border-white/10 rounded-2xl p-4 shadow-xl">
                  <div className="flex items-center justify-between mb-3 text-xs">
                    <div className="flex items-center gap-2 font-bold text-white">
                      <Icon name="users" className="w-4 h-4 text-[#00F2FE]" />
                      <span>Trực tuyến (18)</span>
                    </div>
                  </div>
                  <div className="flex flex-col gap-2">
                    {[
                      { name: 'Trần Gia Hân', status: 'Đang giải Toán' },
                      { name: 'Lê Hoàng Long', status: 'Nghe Lofi Study' },
                      { name: 'Phạm Quỳnh Như', status: 'Phòng thoại #1' }
                    ].map((m, i) => (
                      <div key={i} className="flex items-center justify-between text-xs">
                        <div className="flex items-center gap-2">
                          <span className="w-2 h-2 rounded-full bg-[#00F2FE]"></span>
                          <span className="text-slate-200">{m.name}</span>
                        </div>
                        <span className="text-[10px] text-slate-400">{m.status}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </aside>
            </div>
          </main>

          {/* Mobile Bottom Dock */}
          <nav className="lg:hidden fixed bottom-3 left-4 right-4 z-50 bg-[#151A23]/90 backdrop-blur-2xl border border-white/15 rounded-2xl p-2 shadow-[0_8px_32px_rgba(0,0,0,0.6)]">
            <div className="flex items-center justify-around">
              <button onClick={() => setMobileTab('feed')} className={`flex flex-col items-center gap-1 p-1.5 ${mobileTab === 'feed' ? 'text-[#00F2FE]' : 'text-slate-400'}`}>
                <Icon name="home" className="w-5 h-5" />
                <span className="text-[10px]">Bảng tin</span>
              </button>
              <button onClick={() => setMobileTab('study')} className={`flex flex-col items-center gap-1 p-1.5 ${mobileTab === 'study' ? 'text-[#00F2FE]' : 'text-slate-400'}`}>
                <Icon name="book" className="w-5 h-5" />
                <span className="text-[10px]">Study</span>
              </button>
              <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="w-12 h-12 -mt-5 rounded-full bg-gradient-to-tr from-[#00F2FE] to-[#8B5CF6] text-black flex items-center justify-center shadow-[0_0_20px_rgba(0,242,254,0.4)]">
                <Icon name="plus" className="w-6 h-6 stroke-[3]" />
              </button>
              <button onClick={() => setMobileTab('voice')} className={`flex flex-col items-center gap-1 p-1.5 ${mobileTab === 'voice' ? 'text-[#00F2FE]' : 'text-slate-400'}`}>
                <Icon name="headphones" className="w-5 h-5" />
                <span className="text-[10px]">Lofi</span>
              </button>
              <button onClick={() => setMobileTab('roster')} className={`flex flex-col items-center gap-1 p-1.5 ${mobileTab === 'roster' ? 'text-[#00F2FE]' : 'text-slate-400'}`}>
                <Icon name="users" className="w-5 h-5" />
                <span className="text-[10px]">10A7</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
