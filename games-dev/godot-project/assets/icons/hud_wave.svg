<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad-sword" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Combat Shield Crest -->
  <polygon points="32,6 50,14 46,42 32,56 18,42 14,14" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
  <!-- Crossed Battle Swords -->
  <!-- Sword 1 (Top-Left to Bottom-Right) -->
  <line x1="16" y1="16" x2="48" y2="48" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="24" x2="24" y2="20" stroke="#f59e0b" stroke-width="2"/>
  <!-- Sword 2 (Top-Right to Bottom-Left) -->
  <line x1="48" y1="16" x2="16" y2="48" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="44" y1="24" x2="40" y2="20" stroke="#f59e0b" stroke-width="2"/>
  <!-- Forward Next Wave Arrow -->
  <polygon points="32,24 40,32 35,32 35,42 29,42 29,32 24,32" fill="url(#grad-sword)" stroke="#fef2f2" stroke-width="1.5" filter="url(#glow-red)"/>
</svg>