<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad-orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow-magic" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Cosmic Aura Ring -->
  <ellipse cx="32" cy="32" rx="26" ry="10" fill="none" stroke="#f59e0b" stroke-width="1.8" transform="rotate(-25 32 32)" stroke-dasharray="6,3"/>
  <ellipse cx="32" cy="32" rx="26" ry="10" fill="none" stroke="#c084fc" stroke-width="1.8" transform="rotate(25 32 32)" stroke-dasharray="6,3"/>
  <!-- Mystic Energy Sphere -->
  <circle cx="32" cy="32" r="16" fill="url(#grad-orb)" stroke="#fef08a" stroke-width="2" filter="url(#glow-magic)"/>
  <!-- Central Lightning Spark -->
  <polygon points="34,22 28,32 33,32 30,42 38,31 33,31" fill="#ffffff" filter="url(#glow-magic)"/>
  <!-- Floating Mana Sparks -->
  <circle cx="16" cy="18" r="2" fill="#fbbf24"/>
  <circle cx="48" cy="16" r="2.5" fill="#f472b6"/>
  <circle cx="50" cy="46" r="2" fill="#38bdf8"/>
</svg>