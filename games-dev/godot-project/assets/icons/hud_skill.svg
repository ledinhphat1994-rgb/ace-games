<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad-chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Hexagon Core Frame -->
  <polygon points="32,8 52,19 52,43 32,54 12,43 12,19" fill="#052e16" stroke="#4ade80" stroke-width="2.5" filter="url(#glow-green)"/>
  <!-- Inner Circuit Core -->
  <circle cx="32" cy="31" r="9" fill="url(#grad-chip)" stroke="#bbf7d0" stroke-width="1.5"/>
  <!-- Microchip Traces / Neural Branches -->
  <line x1="32" y1="13" x2="32" y2="22" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="40" x2="32" y2="49" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
  <line x1="17" y1="22" x2="25" y2="27" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
  <line x1="47" y1="22" x2="39" y2="27" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
  <line x1="17" y1="40" x2="25" y2="35" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
  <line x1="47" y1="40" x2="39" y2="35" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
  <!-- Core Node Dots -->
  <circle cx="32" cy="31" r="3" fill="#ffffff"/>
  <circle cx="32" cy="12" r="2" fill="#86efac"/>
  <circle cx="32" cy="50" r="2" fill="#86efac"/>
</svg>