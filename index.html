<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ─── Format Helpers ─────────────────────────────────────────────────────────
function formatVND(val) {
  const num = Number(val) || 0;
  return new Intl.NumberFormat('vi-VN').format(num) + ' đ';
}

function formatDateVN(dateStr) {
  if (!dateStr) return '';
  const parts = dateStr.split('-');
  if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
  return dateStr;
}

function formatTimeOnly(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr.replace(' ', 'T'));
    if (isNaN(d.getTime())) return dateStr;
    return d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
  } catch {
    return dateStr;
  }
}

// ─── Main Application Component ─────────────────────────────────────────────
function DigitalCampusApp() {
  // 1. Authentication State
  const [auth, setAuth] = useState({ loaded: false, isGuest: true, user: null });
  const [showAuthGate, setShowAuthGate] = useState(false);

  // 2. Navigation & Tabs
  const [activeTab, setActiveTab] = useState('lobby'); // lobby | attendance | treasury | students
  const [currentView, setCurrentView] = useState('LOBBY'); // LOBBY | ROOM_ACTIVE
  const [activeRoom, setActiveRoom] = useState(null); // room object
  const [mobileTab, setMobileTab] = useState('ROOMS'); // ROOMS | CHAT | RADIO | UTILS
  const [categoryFilter, setCategoryFilter] = useState('ALL');

  // Sub-tabs for Attendance & Treasury
  const [ddTabSub, setDdTabSub] = useState('ngay'); // 'ngay' | 'tong_hop' | 'ca_nhan'
  const [tqTabSub, setTqTabSub] = useState('thu'); // 'thu' | 'chi'
  const [ddMatrixSearch, setDdMatrixSearch] = useState('');

  // 3. Class Real Data
  const [classData, setClassData] = useState({
    loaded: false,
    lop: { ten: 'Lớp 10A7', namHoc: '2026 – 2027', truong: 'GDNN-GDTX Khu vực 1 - Định Quán', bannerHinhUrl: null, bannerVideoUrl: null },
    hocSinh: [],
    thongBao: [],
    hoatDongLop: [],
    quyKhoan: [],
    quyChi: [],
    quyDong: [],
    thuQuy: null,
    phienBanTkb: null
  });

  // 4. Live Chat State
  const [chatMessages, setChatMessages] = useState([]);
  const [chatInput, setChatInput] = useState('');
  const [chatCaiDat, setChatCaiDat] = useState({ dangMo: 1, gianCachGiay: 5, thongBaoGhim: '' });
  const [biCamChat, setBiCamChat] = useState(false);
  const [chatSending, setChatSending] = useState(false);
  const chatEndRef = useRef(null);

  // 5. Danmaku State
  const [danmakuBullets, setDanmakuBullets] = useState([]);
  const danmakuColors = ['#00F2FE', '#8B5CF6', '#10B981', '#FFB800', '#F43F5E', '#38BDF8'];

  // 6. Attendance State
  const [attendance, setAttendance] = useState({
    loaded: false,
    danhSach: [],
    stats: null,
    ngay: new Date().toISOString().slice(0, 10),
    buoi: 'sang',
    loai: 'chinh',
    caNhan: null
  });

  // 7. Caro Game State
  const [caroRooms, setCaroRooms] = useState([]);
  const [caroActiveRoomId, setCaroActiveRoomId] = useState(null);
  const [caroBoard, setCaroBoard] = useState(() => Array(15).fill(null).map(() => Array(15).fill(null)));
  const [caroTurn, setCaroTurn] = useState('X');
  const [caroWinner, setCaroWinner] = useState(null);
  const [caroMySymbol, setCaroMySymbol] = useState('X');
  const [caroLocalMode, setCaroLocalMode] = useState(false);

  // 8. DJ Radio State
  const [radioPlaying, setRadioPlaying] = useState(false);
  const [radioTitle, setRadioTitle] = useState('Nhạc nền lớp học 10A7');

  // 9. Notifications Center
  const [showNotifModal, setShowNotifModal] = useState(false);
  const [selectedNotif, setSelectedNotif] = useState(null);

  // 10. Student Search & Filter
  const [studentSearch, setStudentSearch] = useState('');
  const [studentToFilter, setStudentToFilter] = useState('ALL');

  // ─── AUTHENTICATION CHECK ─────────────────────────────────────────────────
  const fetchAuth = useCallback(async () => {
    try {
      const res = await fetch('/api/whoami');
      if (res.ok) {
        const data = await res.json();
        if (data.ok) {
          setAuth({
            loaded: true,
            isGuest: false,
            user: {
              name: data.ten || 'Thành viên 10A7',
              role: data.role || 'student',
              vaiTro: data.vaiTro || '',
              chucVu: data.chucVu || '',
              toSo: data.toSo || null,
              hocSinhId: data.hocSinhId || null,
              tenLop: data.tenLop || 'Lớp 10A7',
              namHoc: data.namHoc || '2026 – 2027',
              isTeacher: data.role === 'teacher' || data.role === 'phu'
            }
          });
          return true;
        }
      }
    } catch {}
    setAuth({ loaded: true, isGuest: true, user: null });
    return false;
  }, []);

  // ─── FETCH REAL CLASS DATA ────────────────────────────────────────────────
  const fetchClassData = useCallback(async (isLoggedIn) => {
    if (isLoggedIn) {
      try {
        const res = await fetch('/api/lop');
        if (res.ok) {
          const d = await res.json();
          if (d.ok) {
            setClassData({
              loaded: true,
              lop: d.lop || { ten: 'Lớp 10A7', namHoc: '2026 – 2027', truong: 'GDNN-GDTX Khu vực 1 - Định Quán' },
              hocSinh: d.hocSinh || [],
              thongBao: d.thongBao || [],
              hoatDongLop: d.hoatDongLop || [],
              quyKhoan: d.quyKhoan || [],
              quyChi: d.quyChi || [],
              quyDong: d.quyDong || [],
              thuQuy: d.thuQuy || null,
              phienBanTkb: d.phienBanTkb || null
            });
            return;
          }
        }
      } catch {}
    }

    // Guest fallback
    try {
      const res = await fetch('/api/lop-cong-khai?lop=10a7');
      if (res.ok) {
        const d = await res.json();
        if (d.ok && d.lop) {
          setClassData(prev => ({
            ...prev,
            loaded: true,
            lop: {
              ten: d.lop.ten || 'Lớp 10A7',
              namHoc: d.lop.namHoc || '2026 – 2027',
              truong: d.lop.truong || 'GDNN-GDTX Khu vực 1 - Định Quán'
            }
          }));
          return;
        }
      }
    } catch {}

    setClassData(prev => ({ ...prev, loaded: true }));
  }, []);

  // ─── FETCH REAL ATTENDANCE ────────────────────────────────────────────────
  const fetchAttendance = useCallback(async (customNgay, customBuoi, customLoai) => {
    if (auth.isGuest) return;
    try {
      const qNgay = customNgay || attendance.ngay || new Date().toISOString().slice(0, 10);
      const qBuoi = customBuoi || attendance.buoi || 'sang';
      const qLoai = customLoai || attendance.loai || 'chinh';
      const res = await fetch(`/api/diem-danh?ngay=${encodeURIComponent(qNgay)}&buoi=${encodeURIComponent(qBuoi)}&loai=${encodeURIComponent(qLoai)}`);
      if (res.ok) {
        const d = await res.json();
        if (d.ok && !d.an) {
          let list = d.danhSach || [];
          if ((!list || list.length === 0) && classData.hocSinh && classData.hocSinh.length > 0) {
            list = classData.hocSinh.map(hs => ({
              id: hs.id,
              soThuTu: hs.soThuTu || hs.stt,
              hoTen: hs.hoTen,
              lopNghe: hs.lopNghe,
              dienThoaiHs: hs.dienThoaiHs,
              trangThai: null,
              lyDo: ''
            }));
          }
          const coMat = list.filter(s => s.trangThai === 'co_mat').length;
          const vangCoPhep = list.filter(s => s.trangThai === 'phep' || s.trangThai === 'vang_phep').length;
          const vangKhongPhep = list.filter(s => s.trangThai === 'khong_phep' || s.trangThai === 'vang_khong_phep').length;
          const tre = list.filter(s => s.trangThai === 'tre').length;
          const tong = list.length || classData.hocSinh?.length || 39;
          const daGhi = coMat + vangCoPhep + vangKhongPhep + tre;
          const chuyenCan = daGhi > 0 ? ((coMat / daGhi) * 100).toFixed(1) : '100';

          setAttendance({
            loaded: true,
            danhSach: list,
            stats: { tong, coMat, vangCoPhep, vangKhongPhep, tre, chuyenCan },
            ngay: d.ngay || qNgay,
            buoi: (d.buoi || qBuoi).replace(/_phu$/, ''),
            loai: d.loai || qLoai,
            caNhan: d.caNhan || null
          });
        }
      }
    } catch (err) {
      console.warn('fetchAttendance error:', err);
    }
  }, [auth.isGuest, attendance.ngay, attendance.buoi, attendance.loai, classData.hocSinh]);

  // 1-Touch Attendance Status Toggle
  const handleToggleAttendanceStatus = (studentId, statusKey) => {
    setAttendance(prev => {
      const nextList = prev.danhSach.map(s => {
        if (s.id !== studentId) return s;
        if (statusKey === 'bo_tiet') {
          return { ...s, trangThai: 'khong_phep', lyDo: 'Bỏ tiết' };
        }
        const newStatus = s.trangThai === statusKey ? null : statusKey;
        return { ...s, trangThai: newStatus };
      });
      const coMat = nextList.filter(s => s.trangThai === 'co_mat').length;
      const vangCoPhep = nextList.filter(s => s.trangThai === 'phep' || s.trangThai === 'vang_phep').length;
      const vangKhongPhep = nextList.filter(s => s.trangThai === 'khong_phep' || s.trangThai === 'vang_khong_phep').length;
      const tre = nextList.filter(s => s.trangThai === 'tre').length;
      const tong = nextList.length || 39;
      const daGhi = coMat + vangCoPhep + vangKhongPhep + tre;
      const chuyenCan = daGhi > 0 ? ((coMat / daGhi) * 100).toFixed(1) : '100';
      return {
        ...prev,
        danhSach: nextList,
        stats: { tong, coMat, vangCoPhep, vangKhongPhep, tre, chuyenCan }
      };
    });

    if (auth.user?.isTeacher) {
      const normalizedStatus = statusKey === 'bo_tiet' ? 'vang_khong_phep' :
        (statusKey === 'phep' ? 'vang_phep' : (statusKey === 'khong_phep' ? 'vang_khong_phep' : statusKey));
      const note = statusKey === 'bo_tiet' ? 'Bỏ tiết' : undefined;
      fetch('/api/gv/diem-danh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ngay: attendance.ngay,
          buoi: attendance.buoi,
          loai: attendance.loai,
          ghiNhan: [{ hocSinhId: studentId, trangThai: normalizedStatus, lyDo: note }]
        })
      }).catch(() => {});
    }
  };

  // Batch 1-touch Mark All Present
  const handleBatchMarkAllPresent = () => {
    setAttendance(prev => {
      const nextList = prev.danhSach.map(s => ({ ...s, trangThai: 'co_mat' }));
      const coMat = nextList.length;
      const tong = nextList.length;
      return {
        ...prev,
        danhSach: nextList,
        stats: { tong, coMat, vangCoPhep: 0, vangKhongPhep: 0, tre: 0, chuyenCan: '100' }
      };
    });

    if (auth.user?.isTeacher) {
      const ghiNhan = attendance.danhSach.map(s => ({
        hocSinhId: s.id,
        trangThai: 'co_mat',
        lyDo: ''
      }));
      fetch('/api/gv/diem-danh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ngay: attendance.ngay,
          buoi: attendance.buoi,
          loai: attendance.loai,
          ghiNhan
        })
      }).catch(() => {});
    }
  };

  // Inline Note Change
  const handleAttendanceNoteChange = (studentId, noteText) => {
    setAttendance(prev => ({
      ...prev,
      danhSach: prev.danhSach.map(s => s.id === studentId ? { ...s, lyDo: noteText } : s)
    }));
  };

  // ─── FETCH LIVE CHAT ──────────────────────────────────────────────────────
  const fetchChat = useCallback(async () => {
    try {
      const res = await fetch('/api/chat');
      if (res.ok) {
        const d = await res.json();
        if (d.ok) {
          setChatMessages(d.tinNhan || []);
          if (d.caiDat) setChatCaiDat(d.caiDat);
          setBiCamChat(!!d.biCamChat);
        }
      }
    } catch {}
  }, []);

  // ─── FETCH DJ RADIO INFO ──────────────────────────────────────────────────
  const fetchRadioInfo = useCallback(async () => {
    try {
      const res = await fetch('/api/nhac-nen-info');
      if (res.ok) {
        const d = await res.json();
        if (d.ok && d.nhac && d.nhac.tenBai) {
          setRadioTitle(d.nhac.tenBai);
        }
      }
    } catch {}
  }, []);

  // ─── FETCH CARO ROOMS ─────────────────────────────────────────────────────
  const fetchCaroRooms = useCallback(async () => {
    try {
      const res = await fetch('/api/game?loai=co_caro');
      if (res.ok) {
        const d = await res.json();
        if (d.ok) {
          setCaroRooms(d.danhSachBan || []);
        }
      }
    } catch {}
  }, []);

  // ─── INITIAL LIFECYCLE ────────────────────────────────────────────────────
  useEffect(() => {
    fetchAuth().then(isLoggedIn => {
      fetchClassData(isLoggedIn);
      if (isLoggedIn) {
        fetchChat();
        fetchRadioInfo();
        fetchCaroRooms();
      }
    });
  }, [fetchAuth, fetchClassData, fetchChat, fetchRadioInfo, fetchCaroRooms]);

  // Polling chat every 3.5s
  useEffect(() => {
    if (auth.isGuest) return;
    const t = setInterval(fetchChat, 3500);
    return () => clearInterval(t);
  }, [auth.isGuest, fetchChat]);

  // Scroll chat to bottom on new messages
  useEffect(() => {
    chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [chatMessages]);

  // Fetch tab-specific data
  useEffect(() => {
    if (activeTab === 'attendance' && !attendance.loaded) {
      fetchAttendance();
    }
  }, [activeTab, attendance.loaded, fetchAttendance]);

  // ─── HASH ROUTING SYNC ────────────────────────────────────────────────────
  // Sync URL hash <-> activeTab (bidirectional)
  useEffect(() => {
    const HASH_TO_TAB = { '#/diem-danh': 'attendance', '#/thu-quy': 'treasury' };
    const TAB_TO_HASH = { attendance: '#/diem-danh', treasury: '#/thu-quy' };

    const onHashChange = () => {
      const h = location.hash;
      const tab = HASH_TO_TAB[h];
      if (tab) {
        setActiveTab(tab);
        setCurrentView('LOBBY');

    const dirs = [[0,1], [1,0], [1,1], [1,-1]];
    for (const [dr, dc] of dirs) {
      let count = 1;
      for (let s = 1; s < 5; s++) {
        const nr = r + dr * s, nc = c + dc * s;
        if (nr >= 0 && nr < 15 && nc >= 0 && nc < 15 && board[nr][nc] === val) count++; else break;
      }
      for (let s = 1; s < 5; s++) {
        const nr = r - dr * s, nc = c - dc * s;
        if (nr >= 0 && nr < 15 && nc >= 0 && nc < 15 && board[nr][nc] === val) count++; else break;
      }
      if (count >= 5) return true;
    }
    return false;
  };

    const now = new Date().toLocaleDateString('vi-VN');
    const rows = [
      ['TRUNG TÂM GDNN - GDTX ĐỊNH QUÁN - LỚP 10A7'],
      ['BÁO CÁO CÔNG KHAI THU CHI QUỸ LỚP'],

      ['DANH SÁCH CÁC KHOẢN THU'],
      ['STT', 'Tên khoản thu', 'Số tiền (VNĐ)', 'Trạng thái'],
    ];
    (khoanList || []).forEach((k, idx) => {
      rows.push([
        idx + 1,
        '"' + (k.ten || '').replace(/"/g, '""') + '"',
        Number(k.tongDaThu || k.soTienMoiEm || 0),
        '"' + (k.dangMo ? 'Đang thu' : 'Đã đóng') + '"',
      ]);
    });
    if (!khoanList || khoanList.length === 0) rows.push(['-', 'Không có dữ liệu', 0, '-']);
    rows.push([]);
    rows.push(['DANH SÁCH CÁC KHOẢN CHI']);
    rows.push(['STT', 'Nội dung chi', 'Số tiền (VNĐ)', 'Ngày chi', 'Ghi chú']);
    (chiList || []).forEach((c, idx) => {
      rows.push([
        idx + 1,
        '"' + (c.noiDung || c.noi_dung || '').replace(/"/g, '""') + '"',
        Number(c.soTien || c.so_tien || 0),
        '"' + (c.ngay || '') + '"',

      ]);
    });
    if (!chiList || chiList.length === 0) rows.push(['-', 'Không có dữ liệu', 0, '-', '-']);

    const csvContent = BOM + rows.map(r => r.join(',')).join('\r\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    const dateStr = new Date().toISOString().slice(0, 10);
    link.setAttribute('href', url);
    link.setAttribute('download', 'Bao_Cao_Quy_10A7_' + dateStr + '.csv');

                      className="bg-[#0B0E14] border border-white/10 rounded-xl pl-8 pr-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-[#00F2FE]" />
                    <span className="absolute left-2.5 top-2 text-slate-500">
                      <Ic name="search" className="w-3.5 h-3.5" />
                    </span>
                  </div>

                  <select value={studentToFilter} onChange={e => setStudentToFilter(e.target.value)}
                    className="bg-[#0B0E14] border border-white/10 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-[#00F2FE]">
                    <option value="ALL">Tất cả tổ</option>
                    <option value="1">Tổ 1</option>
                    <option value="2">Tổ 2</option>
                    <option value="3">Tổ 3</option>
                    <option value="4">Tổ 4</option>
                  </select>
                </div>
              </div>

              {auth.isGuest ? (
                <div className="text-center py-12 px-4">
                  <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-[#00F2FE]/20 to-[#8B5CF6]/20 border border-[#00F2FE]/30 flex items-center justify-center mx-auto mb-3 text-2xl">
                    👥
                  </div>
                  <h3 className="text-sm font-bold text-white mb-2">Đăng nhập để xem danh sách lớp</h3>
                  <p className="text-xs text-slate-400 max-w-sm mx-auto mb-5 leading-relaxed">
                    Danh sách học sinh chứa thông tin nội bộ của lớp 10A7. Vui lòng đăng nhập để xem.
                  </p>
                  <a href="/login.html" className="px-6 py-2.5 rounded-xl bg-gradient-to-r from-[#00F2FE] to-[#8B5CF6] text-black font-extrabold text-xs shadow-lg">
                    Đăng nhập ngay →
                  </a>
                </div>
              ) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs border-collapse">
                    <thead>
                      <tr className="border-b border-white/10 text-slate-400 uppercase text-[10px] tracking-wider">
                        <th className="py-2.5 px-3">STT</th>
                        <th className="py-2.5 px-3">Họ và Tên</th>
                        <th className="py-2.5 px-3">Giới Tính</th>
                        <th className="py-2.5 px-3">Tổ</th>
                        <th className="py-2.5 px-3">Lớp Nghề</th>
                        <th className="py-2.5 px-3">Chức Vụ</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-white/5">
                      {filteredStudents.map((hs, i) => (
                        <tr key={hs.id || i} className="hover:bg-white/5 transition-colors">
                          <td className="py-2.5 px-3 text-slate-500 font-mono">{hs.soThuTu || (i + 1)}</td>
                          <td className="py-2.5 px-3 font-semibold text-white">{hs.hoTen}</td>
                          <td className="py-2.5 px-3 text-slate-400">{hs.gioiTinh === 'nu' ? 'Nữ' : 'Nam'}</td>
                          <td className="py-2.5 px-3 text-slate-300 font-medium">Tổ {hs.toSo || '—'}</td>
                          <td className="py-2.5 px-3 text-[#00F2FE]">{hs.lopNghe || '—'}</td>
                          <td className="py-2.5 px-3">
                            {hs.chucVu && hs.chucVu !== 'Học sinh' ? (
                              <span className="px-2 py-0.5 rounded-full bg-[#FFB800]/15 text-[#FFB800] border border-[#FFB800]/30 font-bold text-[10px]">
                                {hs.chucVu}
                              </span>
                            ) : (
                              <span className="text-slate-500 text-[11px]">Thành viên</span>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}
        </main>

        {/* ─── RIGHT SIDEBAR (Desktop) ──────────────────────── */}
        <aside className="hidden lg:flex flex-col gap-4 sticky top-24 h-[calc(100vh-8rem)] overflow-y-auto pl-1">

          {/* Classroom DJ Radio Player */}
          <div className="bg-[#151A23] border border-white/10 rounded-2xl p-4 shadow-xl">
            <div className="flex items-center justify-between mb-3">
              <div className="flex items-center gap-2 text-xs font-bold text-white">
                <Ic name="radio" className="w-4 h-4 text-[#00F2FE]" />
                <span>Classroom DJ Radio 📻</span>
              </div>
              <span className={`text-[10px] font-mono px-2 py-0.5 rounded-full border ${radioPlaying ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' : 'text-slate-500 bg-white/5 border-white/10'}`}>
                {radioPlaying ? 'LIVE' : 'OFF'}
              </span>
            </div>
            <p className="text-xs font-bold text-white truncate mb-1">{radioTitle}</p>
            <p className="text-[10px] text-slate-400 mb-3">Phát trực tiếp từ kho âm thanh lớp 10A7</p>

            {/* Visualizer bars */}
            <div className="flex items-end gap-1 h-6 mb-3">
              {[14, 22, 16, 26, 12, 20, 15, 24, 18, 12, 20, 16].map((v, i) => (
                <span key={i}
                  style={{ height: radioPlaying ? `${Math.max(4, (v * (i % 3 + 1)) % 24)}px` : '4px' }}
                  className="flex-1 bg-gradient-to-t from-[#00F2FE] to-[#8B5CF6] rounded-full transition-all duration-300">
                </span>
              ))}
            </div>

            <button onClick={toggleRadio}
              className="w-full flex items-center justify-center gap-2 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-white font-bold text-xs border border-white/10 transition-all">
              <Ic name={radioPlaying ? 'pause' : 'play'} className="w-3.5 h-3.5" />
              <span>{radioPlaying ? 'Tạm Dừng Nhạc' : 'Phát Nhạc Nền'}</span>
            </button>
          </div>

          {/* Live Chat Box */}
          <div className="bg-[#151A23] border border-white/10 rounded-2xl p-4 shadow-xl flex-1 flex flex-col min-h-[320px]">
            <div className="flex items-center justify-between mb-3 pb-2 border-b border-white/10">
              <span className="text-xs font-bold text-white">Chat Lớp Trực Tiếp</span>
              <span className="text-[10px] text-[#00F2FE] flex items-center gap-1">
                <span className="w-1.5 h-1.5 rounded-full bg-[#00F2FE] animate-pulse"></span>
                <span>D1 Live Sync</span>
              </span>
            </div>

            {/* Message Stream */}
            <div className="flex-1 overflow-y-auto space-y-2 pr-1 max-h-64">
              {chatMessages.length > 0 ? (
                chatMessages.map(m => (
                  <div key={m.id} className="text-xs bg-[#0B0E14]/70 p-2.5 rounded-xl border border-white/5">
                    <div className="flex items-center justify-between mb-0.5">
                      <span className={`font-bold truncate ${m.vaiTro === 'giao_vien' ? 'text-[#FFB800]' : 'text-[#00F2FE]'}`}>
                        {m.tenNguoiGui || 'Học sinh'}
                      </span>
                      <span className="text-[9px] text-slate-500 font-mono">{formatTimeOnly(m.taoLuc)}</span>
                    </div>
                    <p className="text-slate-200 break-words leading-relaxed">{m.noiDung}</p>
                  </div>
                ))
              ) : (
                <div className="py-8 text-center text-slate-500 text-xs">
                  Chưa có tin nhắn nào. Hãy gửi lời chào đầu tiên!
                </div>
              )}
              <div ref={chatEndRef} />
            </div>

            {/* Chat Input Form */}
            <form onSubmit={handleSendChat} className="mt-3 flex items-center gap-2">
              <input type="text" value={chatInput} onChange={e => setChatInput(e.target.value)}
                placeholder={auth.isGuest ? 'Đăng nhập để chat...' : (biCamChat ? 'Bạn đang bị cấm chat' : 'Nhắn tin lớp / Danmaku...')}
                disabled={auth.isGuest || biCamChat || chatSending}
                className="flex-1 bg-[#0B0E14] border border-white/10 rounded-xl px-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-[#00F2FE] disabled:opacity-40" />
              <button type="submit" disabled={auth.isGuest || biCamChat || chatSending}
                className="p-2 rounded-xl bg-[#00F2FE] text-black font-bold shadow-[0_0_8px_rgba(0,242,254,0.3)] hover:scale-105 transition-all disabled:opacity-40">
                <Ic name="send" className="w-3.5 h-3.5" />
              </button>
            </form>
          </div>
        </aside>
      </div>

      {/* ══════════════════════════════════════════════════════════════════════
           MOBILE BOTTOM NAVIGATION
      ══════════════════════════════════════════════════════════════════════ */}
      <nav className="fixed bottom-0 inset-x-0 z-40 bg-[#151A23]/95 backdrop-blur-xl border-t border-white/10 flex lg:hidden items-center justify-around py-2.5 px-2 shadow-[0_-4px_20px_rgba(0,0,0,0.5)]">
        <button onClick={() => { setActiveTab('lobby'); setCurrentView('LOBBY'); setMobileTab('ROOMS'); }}
          className={`flex flex-col items-center gap-1 text-[11px] font-bold transition-all ${activeTab === 'lobby' ? 'text-[#00F2FE]' : 'text-slate-400'}`}>
          <Ic name="tv" className="w-5 h-5" />
          <span>Sảnh Lớp</span>
        </button>
        <button onClick={() => { setActiveTab('attendance'); setCurrentView('LOBBY'); setMobileTab('ROOMS'); }}
          className={`flex flex-col items-center gap-1 text-[11px] font-bold transition-all ${activeTab === 'attendance' ? 'text-[#00F2FE]' : 'text-slate-400'}`}>
          <Ic name="check" className="w-5 h-5" />
          <span>Điểm Danh</span>
        </button>
        <button onClick={() => { setActiveTab('treasury'); setCurrentView('LOBBY'); setMobileTab('ROOMS'); }}
          className={`flex flex-col items-center gap-1 text-[11px] font-bold transition-all ${activeTab === 'treasury' ? 'text-[#00F2FE]' : 'text-slate-400'}`}>
          <span className="text-base leading-none">💰</span>
          <span>Thủ Quỹ</span>
        </button>
        <button onClick={() => { setActiveTab('students'); setCurrentView('LOBBY'); setMobileTab('ROOMS'); }}
          className={`flex flex-col items-center gap-1 text-[11px] font-bold transition-all ${activeTab === 'students' ? 'text-[#00F2FE]' : 'text-slate-400'}`}>
          <Ic name="users" className="w-5 h-5" />
          <span>Học Sinh</span>
        </button>
      </nav>

      {/* ══════════════════════════════════════════════════════════════════════
           NOTIFICATIONS MODAL
      ══════════════════════════════════════════════════════════════════════ */}
      {showNotifModal && (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-[#151A23] border border-white/15 rounded-3xl p-6 max-w-lg w-full shadow-2xl animate-scaleIn max-h-[85vh] flex flex-col">
            <div className="flex items-center justify-between pb-3 border-b border-white/10 mb-4">
              <h3 className="text-base font-extrabold text-white flex items-center gap-2">
                <Ic name="bell" className="w-5 h-5 text-[#00F2FE]" />
                <span>Thông Báo Lớp 10A7</span>
              </h3>
              <button onClick={() => setShowNotifModal(false)} className="p-1 rounded-lg text-slate-400 hover:text-white">
                <Ic name="x" className="w-5 h-5" />
              </button>
            </div>

            <div className="overflow-y-auto flex-1 space-y-3 pr-1">
              {classData.thongBao && classData.thongBao.length > 0 ? (
                classData.thongBao.map((tb, idx) => (
                  <div key={tb.id || idx} className="bg-[#0B0E14] border border-white/5 rounded-2xl p-4">
                    <div className="flex items-center justify-between gap-2 mb-1.5">
                      <span className="text-xs font-bold text-[#00F2FE]">{formatDateVN(tb.ngay)}</span>
                      {tb.ghim && <span className="text-[10px] px-2 py-0.5 rounded bg-amber-500/15 text-[#FFB800] font-bold">Ghim</span>}
                    </div>
                    <h4 className="text-sm font-bold text-white mb-2">{tb.tieuDe}</h4>
                    <p className="text-xs text-slate-300 leading-relaxed whitespace-pre-line">{tb.noiDung}</p>
                  </div>
                ))
              ) : (
                <div className="py-8 text-center text-slate-400 text-xs">Hiện tại chưa có thông báo mới nào.</div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* ══════════════════════════════════════════════════════════════════════
           AUTH GATE MODAL (Khi khách bấm tương tác)
      ══════════════════════════════════════════════════════════════════════ */}
      {showAuthGate && (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-[#151A23] border border-[#8B5CF6]/40 rounded-3xl p-6 max-w-md w-full shadow-2xl text-center animate-scaleIn">
            <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-[#8B5CF6] to-[#00F2FE] flex items-center justify-center text-2xl mx-auto mb-3 shadow-lg">
              🔐
            </div>
            <h3 className="text-base font-extrabold text-white mb-2">Yêu Cầu Đăng Nhập</h3>
            <p className="text-xs text-slate-300 mb-6 leading-relaxed">
              Bạn đang duyệt xem dưới dạng khách. Để tham gia chat, đấu cờ caro trực tuyến hoặc xem sổ điểm danh và quỹ, vui lòng đăng nhập vào tài khoản của mình.
            </p>
            <div className="flex flex-col gap-2">
              <a href="/login.html" className="w-full py-2.5 rounded-xl bg-gradient-to-r from-[#00F2FE] to-[#8B5CF6] text-black font-extrabold text-xs shadow-lg">
                Đăng nhập ngay →
              </a>
              <button onClick={() => setShowAuthGate(false)} className="w-full py-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-slate-400 text-xs font-semibold">
                Tiếp tục xem trang
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<DigitalCampusApp />);
</script>

</body>
</html>
