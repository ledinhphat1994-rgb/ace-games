<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script src="/theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#10120f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      /* Chặn triệt để cử chỉ mặc định trên Canvas game theo chuẩn AGENTS.md */
      canvas,
      .game-canvas,
      .snake-canvas-container {
        touch-action: none !important;
        -webkit-touch-callout: none !important;
        -webkit-user-select: none !important;
        user-select: none !important;
        overscroll-behavior: none !important;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Noto+Serif+SC:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Ace Games</title>
    <meta name="description" content="Đấu Trường Trò Chơi Trực Tuyến Ace Games." />
    <meta property="og:title" content="Ace Games" />
    <meta property="og:description" content="Đấu Trường Trò Chơi Trực Tuyến Ace Games." />
  </head>
  <body>
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020617;user-select:none;">
        <div style="position:relative;width:80px;height:80px;display:flex;align-items:center;justify-content:center;">
          <div style="position:absolute;inset:-6px;border-radius:30%;background:linear-gradient(to top right,rgba(56,189,248,0.4),rgba(99,102,241,0.3),rgba(6,182,212,0.4));filter:blur(9px);animation:initPulse 2s cubic-bezier(0.4,0,0.6,1) infinite;"></div>
          <div style="position:relative;width:100%;height:100%;border-radius:24%;overflow:hidden;border:1px solid rgba(56,189,248,0.5);background:linear-gradient(to bottom,#0d1d36,#091528,#050e1c);box-shadow:0 4px 16px rgba(14,165,233,0.25);display:flex;align-items:center;justify-content:center;">
            <div style="position:absolute;top:0;left:0;right:0;height:38%;background:linear-gradient(to bottom,rgba(255,255,255,0.25),transparent);pointer-events:none;"></div>
            <svg viewBox="0 0 100 100" style="width:56px;height:56px;position:relative;" fill="none">
              <defs>
                <linearGradient id="init-a-grad" x1="15%" y1="10%" x2="85%" y2="90%">
                  <stop offset="0%" stop-color="#38bdf8"/>
                  <stop offset="45%" stop-color="#0284c7"/>
                  <stop offset="100%" stop-color="#4f46e5"/>
                </linearGradient>
                <linearGradient id="init-a-shine" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
                  <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
                </linearGradient>
                <clipPath id="init-a-clip">
                  <path d="M50 16C43.5 16 35.8 28.5 28.5 44.5C21.8 59.2 17.5 73.2 18.2 78.4C18.8 82.5 22.8 84.5 26.8 82.8C32.5 80.4 39.5 70.8 44.2 60.5C46.8 54.8 48.8 49.8 50 49.8C51.2 49.8 53.2 54.8 55.8 60.5C60.5 70.8 67.5 80.4 73.2 82.8C77.2 84.5 81.2 82.5 81.8 78.4C82.5 73.2 78.2 59.2 71.5 44.5C64.2 28.5 56.5 16 50 16Z"/>
                </clipPath>
              </defs>
              <path d="M50 16C43.5 16 35.8 28.5 28.5 44.5C21.8 59.2 17.5 73.2 18.2 78.4C18.8 82.5 22.8 84.5 26.8 82.8C32.5 80.4 39.5 70.8 44.2 60.5C46.8 54.8 48.8 49.8 50 49.8C51.2 49.8 53.2 54.8 55.8 60.5C60.5 70.8 67.5 80.4 73.2 82.8C77.2 84.5 81.2 82.5 81.8 78.4C82.5 73.2 78.2 59.2 71.5 44.5C64.2 28.5 56.5 16 50 16Z" fill="url(#init-a-grad)"/>
              <path d="M50 20C47.2 20 42.8 28.2 37.8 40.2C33.2 51.5 29.5 63 29.8 68.2C32.8 66 37.8 58.2 42 49.5C45.2 42.8 48.2 36.8 50 36.8C51.8 36.8 54.8 42.8 58 49.5C62.2 58.2 67.2 66 70.2 68.2C70.5 63 66.8 51.5 62.2 40.2C57.2 28.2 52.8 20 50 20Z" fill="url(#init-a-shine)" opacity="0.65"/>
              <g clip-path="url(#init-a-clip)">
                <path d="M 23 81 C 26 58, 41 21, 50 18 C 59 21, 74 58, 77 81" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" style="animation:initTrace 1.3s cubic-bezier(0.4,0,0.2,1) infinite;filter:drop-shadow(0 0 6px #38bdf8);"/>
                <path d="M 23 81 C 26 58, 41 21, 50 18 C 59 21, 74 58, 77 81" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" style="animation:initTrace 1.3s cubic-bezier(0.4,0,0.2,1) infinite;filter:drop-shadow(0 0 3px #ffffff);"/>
              </g>
            </svg>
            <style>
              @keyframes initTrace {
                0% { stroke-dasharray: 45 160; stroke-dashoffset: 160; opacity: 0; }
                15% { opacity: 1; }
                85% { opacity: 1; }
                100% { stroke-dasharray: 45 160; stroke-dashoffset: -160; opacity: 0; }
              }
              @keyframes initPulse { 50% { opacity: .5; } }
            </style>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
