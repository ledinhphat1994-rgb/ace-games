<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lớp 10A7 Digital Campus & Bảng Tin Cộng Đồng · GDNN-GDTX Huyện Định Quán">
  <meta name="theme-color" content="#0B0E14">
  <meta property="og:title" content="Lớp 10A7 · Digital Campus & Cộng Đồng">
  <meta property="og:description" content="Không gian trường học ảo, phòng hoạt động trực tiếp và bảng tin cộng đồng lớp 10A7.">
  <meta property="og:type" content="website">
  <title>Lớp 10A7 · Digital Campus · GDTX Định Quán</title>
  <link rel="icon" href="assets/img/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- Google Fonts: Be Vietnam Pro — chuyên nghiệp, hỗ trợ tiếng Việt đầy đủ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">

  <!-- Core SaaS Class Design System Tokens & Custom Styles -->
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['"Be Vietnam Pro"', 'sans-serif'] },
          colors: {
            obsidian: '#0B0E14',
            surface: '#151A23',
            surfaceBorder: 'rgba(255, 255, 255, 0.08)',
            cyanGlow: '#00F2FE',
            violetGlow: '#8B5CF6',
            amberGold: '#FFB800',
          },
          gridTemplateColumns: { '15': 'repeat(15, minmax(0, 1fr))' }
        }
      }
    }
  </script>

  <!-- React 18 + ReactDOM qua CDN; JSX đã compile sẵn trong assets/gen/ (không cần Babel runtime) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background-color: #0B0E14;
      color: #f1f5f9;
      font-family: 'Be Vietnam Pro', sans-serif;
      margin: 0;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Danmaku bullet animation */
    @keyframes danmakuFly {
      0%   { transform: translateX(100vw); }
      100% { transform: translateX(-100%); }
    }
    .danmaku-bullet {
      position: absolute;
      white-space: nowrap;
      pointer-events: none;
      font-weight: 800;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8), 0 0 12px currentColor;
      animation: danmakuFly linear forwards;
    }

    /* Events Ticker */
    @keyframes tickerScroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .ticker-track {
      display: inline-flex;
      white-space: nowrap;
      animation: tickerScroll 32s linear infinite;
    }
    .ticker-track:hover {
      animation-play-state: paused;
    }

    /* Transitions */
    @keyframes fadeIn  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(.95); }      to { opacity: 1; transform: none; } }
    .animate-fadeIn  { animation: fadeIn .3s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .animate-scaleIn { animation: scaleIn .25s cubic-bezier(0.16, 1, 0.3, 1) both; }

    /* Equalizer Pulse Animation */
    @keyframes eqBarPulse {
      0%, 100% { transform: scaleY(0.25); }
      50% { transform: scaleY(1); }
    }
    .eq-bar {
      transform-origin: bottom;
      animation: eqBarPulse 1.2s ease-in-out infinite;
    }
    .eq-bar:nth-child(2) { animation-delay: 0.2s; }
    .eq-bar:nth-child(3) { animation-delay: 0.4s; }
    .eq-bar:nth-child(4) { animation-delay: 0.1s; }
    .eq-bar:nth-child(5) { animation-delay: 0.35s; }

    /* Flagship Card Alive Animations (Subtle & Premium) */
    @keyframes cinemaRayBreath {
      0%, 100% { opacity: 0.65; transform: scaleY(0.98); }
      50% { opacity: 0.95; transform: scaleY(1.02); }
    }
    .cinema-ray {
      transform-origin: 160px 20px;
      animation: cinemaRayBreath 4s ease-in-out infinite;
    }

    @keyframes arenaGlowBreath {
      0%, 100% { transform: scale(0.96); opacity: 0.7; }
      50% { transform: scale(1.04); opacity: 1; }
    }
    .arena-glow {
      transform-origin: 160px 90px;
      animation: arenaGlowBreath 4.5s ease-in-out infinite;
    }

    @keyframes piecePulse {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; filter: drop-shadow(0 0 4px currentColor); }
    }
    .caro-piece-o { animation: piecePulse 3s ease-in-out infinite; color: #FFB800; }
    .caro-piece-x { animation: piecePulse 3s ease-in-out infinite 1.5s; color: #00F2FE; }

    @keyframes chatDotPulse {
      0%, 100% { opacity: 0.3; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-2.5px); }
    }
    .chat-dot-1 { animation: chatDotPulse 1.5s infinite ease-in-out; }
    .chat-dot-2 { animation: chatDotPulse 1.5s infinite ease-in-out 0.25s; }
    .chat-dot-3 { animation: chatDotPulse 1.5s infinite ease-in-out 0.5s; }

    /* Accessibility: tôn trọng prefers-reduced-motion — tắt mọi animation trang trí */
    /* Phase 4E: Borderless Activity Portals Keyframes */
    @keyframes orbitSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes orbitSpinRev {
      from { transform: rotate(360deg); }
      to   { transform: rotate(0deg); }
    }
    @keyframes portalPulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.85; filter: drop-shadow(0 0 12px currentColor); }
      50%      { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 24px currentColor); }
    }
    @keyframes scanRipple {
      0%   { transform: scale(0.85); opacity: 0.7; }
      100% { transform: scale(1.35); opacity: 0; }
    }
    @keyframes particleDrift {
      0%, 100% { transform: translate(0, 0); }
      25%      { transform: translate(4px, -6px); }
      50%      { transform: translate(-3px, 5px); }
      75%      { transform: translate(-5px, -3px); }
    }

    .portal-orbit-slow    { animation: orbitSpin 14s linear infinite; transform-origin: center; }
    .portal-orbit-rev     { animation: orbitSpinRev 18s linear infinite; transform-origin: center; }
    .portal-pulse-glow    { animation: portalPulseGlow 4s ease-in-out infinite; }
    .portal-scan-ripple   { animation: scanRipple 3.5s cubic-bezier(0, 0.2, 0.8, 1) infinite; transform-origin: center; }
    .portal-drift         { animation: particleDrift 8s ease-in-out infinite; }

    @keyframes universeOrbitHocTap {
      0%   { transform: translate3d(-270px, -35px, 0); }
      25%  { transform: translate3d(-190px, 45px, 0); }
      50%  { transform: translate3d(-140px, 15px, 0); }
      75%  { transform: translate3d(-210px, -50px, 0); }
      100% { transform: translate3d(-270px, -35px, 0); }
    }
    @keyframes universeOrbitGame {
      0%   { transform: translate3d(270px, 35px, 0); }
      25%  { transform: translate3d(190px, -45px, 0); }
      50%  { transform: translate3d(140px, -15px, 0); }
      75%  { transform: translate3d(210px, 50px, 0); }
      100% { transform: translate3d(270px, 35px, 0); }
    }

    .universe-orbit-hoctap { animation: universeOrbitHocTap 28s ease-in-out infinite; will-change: transform; }
    .universe-orbit-game   { animation: universeOrbitGame 32s ease-in-out infinite; will-change: transform; }

    .universe-orbit-hoctap:hover,
    .universe-orbit-game:hover,
    .universe-orbit-hoctap:focus-within,
    .universe-orbit-game:focus-within,
    .universe-orbit-hoctap:active,
    .universe-orbit-game:active {
      animation-play-state: paused !important;
    }

    @keyframes floatDriftYouTube {
      0%   { transform: translate3d(0, 0, 0); }
      25%  { transform: translate3d(10px, -14px, 0); }
      50%  { transform: translate3d(-8px, -16px, 0); }
      75%  { transform: translate3d(-12px, 8px, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }
    @keyframes floatDriftGame {
      0%   { transform: translate3d(0, 0, 0); }
      25%  { transform: translate3d(-12px, 12px, 0); }
      50%  { transform: translate3d(8px, 14px, 0); }
      75%  { transform: translate3d(14px, -10px, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }
    @keyframes floatDriftMusic {
      0%   { transform: translate3d(0, 0, 0); }
      33%  { transform: translate3d(8px, 12px, 0); }
      66%  { transform: translate3d(-10px, -8px, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }

    .portal-float-youtube { animation: floatDriftYouTube 16s ease-in-out infinite; will-change: transform; }
    .portal-float-game    { animation: floatDriftGame 18s ease-in-out infinite; will-change: transform; }
    .portal-float-music   { animation: floatDriftMusic 14s ease-in-out infinite; will-change: transform; }

    .portal-float-youtube:hover,
    .portal-float-game:hover,
    .portal-float-music:hover,
    .group:hover .portal-float-youtube,
    .group:hover .portal-float-game,
    .group:hover .portal-float-music,
    .group:focus-within .portal-float-youtube,
    .group:focus-within .portal-float-game,
    .group:focus-within .portal-float-music {
      animation-play-state: paused;
    }

    @media (prefers-reduced-motion: reduce) {
      .danmaku-bullet, .ticker-track, .eq-bar,
      .cinema-ray, .arena-glow, .caro-piece-o, .caro-piece-x,
      .chat-dot-1, .chat-dot-2, .chat-dot-3,
      .portal-orbit-slow, .portal-orbit-rev, .portal-pulse-glow, .portal-scan-ripple, .portal-drift,
      .portal-float-youtube, .portal-float-game, .portal-float-music,
      .universe-orbit-hoctap, .universe-orbit-game,
      .animate-fadeIn, .animate-scaleIn, .animate-pulse {
        animation: none !important;
        transform: none !important;
      }
    }

    /* Focus ring rõ ràng cho điều hướng bàn phím */
    button:focus-visible, a:focus-visible, input:focus-visible {
      outline: 2px solid #00F2FE;
      outline-offset: 1px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0B0E14; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }

    /* Mobile Optimizations */
    @media (max-width: 768px) {
      .mobile-touch-target {
        min-height: 48px;
        min-width: 48px;
      }

      .mobile-bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(11, 14, 20, 0.95);
        backdrop-filter: blur(10px);
        border-top: 1px solid rgba(255,255,255,0.1);
        z-index: 50;
        padding: 8px 16px;
        padding-bottom: max(8px, env(safe-area-inset-bottom));
      }

      .mobile-nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 10px;
        color: #94a3b8;
        transition: color 0.2s;
      }

      .mobile-nav-item.active {
        color: #00F2FE;
      }

      .mobile-nav-item:active {
        transform: scale(0.95);
      }

      /* Hide desktop elements on mobile */
      .desktop-only {
        display: none !important;
      }

      /* Mobile-specific layout adjustments */
      .mobile-grid {
        grid-template-columns: 1fr !important;
      }

      .mobile-stack {
        flex-direction: column !important;
      }

      /* Larger touch targets for mobile */
      button, a, input, select {
        min-height: 44px;
      }

      /* Prevent horizontal scroll on mobile */
      body {
        overflow-x: hidden;
      }
    }

    @media (min-width: 769px) {
      .mobile-only {
        display: none !important;
      }
    }

    /* ─── In báo cáo Sổ Quỹ ra khổ A4: chỉ giữ khu #thu-quy, ẩn toàn bộ UI khác ─── */
    @media print {
      @page { size: A4 portrait; margin: 14mm; }
      body { background: #ffffff !important; color: #111827 !important; }
      body * { visibility: hidden; }
      #thu-quy, #thu-quy * { visibility: visible; }
      #thu-quy {
        position: absolute !important;
        inset: 0 auto auto 0 !important;
        width: 100% !important;
        max-height: none !important;
        overflow: visible !important;
        background: #ffffff !important;
        border: none !important;
        box-shadow: none !important;
        color: #111827 !important;
        padding: 0 !important;
      }
      #thu-quy * { color: #111827 !important; background: transparent !important; border-color: #d1d5db !important; box-shadow: none !important; text-shadow: none !important; }
      #thu-quy button { display: none !important; }
      #thu-quy .rounded-xl, #thu-quy .rounded-2xl { border: 1px solid #e5e7eb !important; break-inside: avoid; }
    }
  </style>
</head>
<body>

<div id="root"></div>

<!-- Background Audio Player (Classroom DJ Radio) -->
<audio id="bgAudio" preload="none" loop></audio>

<script type="module" src="/assets/gen/campus-app.js"></script>

</body>
</html>
