<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class 10A7 Digital Campus · Virtual School & Activity Lobby</title>
  <link rel="icon" href="assets/img/icon-192.png">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            obsidian: '#0B0E14',
            surface: '#151A23',
            cyanGlow: '#00F2FE',
            violetGlow: '#8B5CF6',
            amberGold: '#FFB800',
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #0B0E14;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    @keyframes danmakuMove {
      0% {
        transform: translateX(100%);
        right: 0%;
      }
      100% {
        transform: translateX(-100%);
        right: 100%;
      }
    }
    .danmaku-item {
      position: absolute;
      white-space: nowrap;
      animation-name: danmakuAnim;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }
    @keyframes danmakuAnim {
      from { left: 100%; transform: translateX(0); }
      to { left: -100%; transform: translateX(0); }
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0B0E14;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-[#0B0E14] text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // SVG Icons Helper
    const Icon = ({ name, className = "w-4 h-4", ...props }) => {
      const icons = {
        tv: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect width="20" height="15" x="2" y="7" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>,
        gamepad: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="6" x2="10" y1="12" y2="12"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="15" x2="15.01" y1="13" y2="13"/><line x1="18" x2="18.01" y1="11" y2="11"/><rect width="20" height="12" x="2" y="6" rx="6"/></svg>,
        headphones: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>,
        lock: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
        unlock: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>,
        sparkles: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>,
        radio: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/></svg>,
        shield: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>,
        plus: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>,
        arrowLeft: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="19" x2="5" y1="12" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>,
        send: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>,
        check: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="20 6 9 17 4 12"/></svg>,
        ghost: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M9 10h.01"/><path d="M15 10h.01"/><path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z"/></svg>,
        eye: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>,
        eyeOff: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>,
        play: <svg className={className} viewBox="0 0 24 24" fill="currentColor" {...props}><polygon points="5 3 19 12 5 21 5 3"/></svg>,
        pause: <svg className={className} viewBox="0 0 24 24" fill="currentColor" {...props}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>,
        users: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
        clock: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
        x: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>,
      };
      return icons[name] || null;
    };

    function DigitalCampusApp() {
      const [currentView, setCurrentView] = useState('LOBBY');
      const [selectedRoom, setSelectedRoom] = useState(null);
      const [categoryFilter, setCategoryFilter] = useState('ALL');
      const [isTeacherMode, setIsTeacherMode] = useState(false);
      const [revealedAuthors, setRevealedAuthors] = useState({});
      const [danmakuEnabled, setDanmakuEnabled] = useState(true);

      const [rooms, setRooms] = useState([
        {
          id: 'room-cinema-1',
          title: '🍿 Chiếu Phim & Xem Youtube Chung: Ôn Thi Lý 10',
          type: 'CINEMA',
          privacy: 'PUBLIC_CLASS',
          host: 'Thầy Lê Đình Phát (GVCN)',
          membersCount: 16,
          maxCapacity: 45,
          thumbnail: 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500&auto=format&fit=crop&q=80',
          videoTitle: 'Vật Lý 10: Chuyển Động Thẳng Biến Đổi Đều - Bài Giảng Minh Họa 3D',
          videoProgress: '14:28 / 38:50'
        },
        {
          id: 'room-game-1',
          title: '⚔️ Đấu Trường Cờ Caro 15x15: Bảo vs Kiệt',
          type: 'GAME_CARO',
          privacy: 'DUO_POD',
          host: 'Phan Quốc Bảo',
          membersCount: 2,
          maxCapacity: 2,
          thumbnail: 'https://images.unsplash.com/photo-1610890716171-6b1bb98ffd09?w=500&auto=format&fit=crop&q=80',
        },
        {
          id: 'room-lofi-1',
          title: '🎧 Lofi Study Cafe: Mưa Rơi & Đọc Sách',
          type: 'LOFI_STUDY',
          privacy: 'SQUAD_POD',
          host: 'Lê Hoàng Long',
          membersCount: 4,
          maxCapacity: 6,
          thumbnail: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500&auto=format&fit=crop&q=80',
        },
        {
          id: 'room-solo-1',
          title: '🔒 Góc Tự Học Cá Nhân (Do Not Disturb)',
          type: 'LOFI_STUDY',
          privacy: 'SOLO_POD',
          host: 'Ngô Thanh Sơn',
          membersCount: 1,
          maxCapacity: 1,
          isLocked: true,
          thumbnail: 'https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=500&auto=format&fit=crop&q=80',
        }
      ]);

      const [danmakuList, setDanmakuList] = useState([
        { id: 1, text: 'Thầy giảng dễ hiểu quá! ❤️', color: '#00F2FE', top: 15, duration: 8 },
        { id: 2, text: 'Đáp án bài 3 là v = v0 + at nha mn 📐', color: '#FFB800', top: 40, duration: 10 },
        { id: 3, text: '10A7 mãi đỉnh 🔥🔥🔥', color: '#F43F5E', top: 68, duration: 7 },
      ]);

      // Caro 15x15 board
      const [caroBoard, setCaroBoard] = useState(() => Array(15).fill(null).map(() => Array(15).fill(null)));
      const [caroTurn, setCaroTurn] = useState('X');
      const [caroWinner, setCaroWinner] = useState(null);

      // Chat
      const [chatMessages, setChatMessages] = useState([
        { id: 1, author: 'Thầy Lê Đình Phát', text: 'Chào cả lớp! Ai vào phòng rồi nhớ mở âm lượng vừa đủ nghe nhé.', time: '20:01' },
        { id: 2, author: 'Trần Gia Hân', text: 'Dạ Thầy! Màn hình chiếu nét lắm ạ.', time: '20:02' },
        { id: 3, author: 'Phan Quốc Bảo', text: 'Ai rảnh ra bàn Cờ Caro làm ván solo không nào? 🔥', time: '20:03' },
      ]);
      const [chatInput, setChatInput] = useState('');

      // Create Room Modal
      const [showModal, setShowModal] = useState(false);
      const [modalTitle, setModalTitle] = useState('');
      const [modalType, setModalType] = useState('CINEMA');
      const [modalPrivacy, setModalPrivacy] = useState('SQUAD_POD');

      // DJ
      const [djPlaying, setDjPlaying] = useState(true);

      const handleCellClick = (r, c) => {
        if (caroBoard[r][c] || caroWinner) return;
        const newB = caroBoard.map(row => [...row]);
        newB[r][c] = caroTurn;
        setCaroBoard(newB);
        setCaroTurn(caroTurn === 'X' ? 'O' : 'X');
      };

      const handleSendChat = (e) => {
        e.preventDefault();
        if (!chatInput.trim()) return;
        const newMsg = {
          id: Date.now(),
          author: isTeacherMode ? 'Thầy Lê Đình Phát (GVCN)' : 'Trần Gia Hân',
          text: chatInput,
          time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
        };
        setChatMessages([...chatMessages, newMsg]);

        if (danmakuEnabled) {
          const colors = ['#00F2FE', '#8B5CF6', '#10B981', '#FFB800', '#F43F5E'];
          setDanmakuList(prev => [
            ...prev,
            {
              id: Date.now(),
              text: chatInput,
              color: colors[Math.floor(Math.random() * colors.length)],
              top: Math.floor(Math.random() * 70) + 10,
              duration: 8
            }
          ]);
        }
        setChatInput('');
      };

      const handleCreateRoomSubmit = (e) => {
        e.preventDefault();
        if (!modalTitle.trim()) return;
        const newRoom = {
          id: `room-${Date.now()}`,
          title: modalTitle,
          type: modalType,
          privacy: modalPrivacy,
          host: isTeacherMode ? 'Thầy Lê Đình Phát' : 'Trần Gia Hân',
          membersCount: 1,
          maxCapacity: modalPrivacy === 'SOLO_POD' ? 1 : modalPrivacy === 'DUO_POD' ? 2 : 6,
          thumbnail: 'https://images.unsplash.com/photo-1511512578047-dfb367046420?w=500&auto=format&fit=crop&q=80',
        };
        setRooms([newRoom, ...rooms]);
        setShowModal(false);
        setSelectedRoom(newRoom);
        setCurrentView('ROOM_ACTIVE');
      };

      return (
        <div className="min-h-screen bg-[#0B0E14] text-slate-100 selection:bg-[#00F2FE]/30">
          {/* Header */}
          <header className="sticky top-0 z-40 bg-[#0B0E14]/90 backdrop-blur-xl border-b border-white/10 px-4 h-16 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#00F2FE] via-[#8B5CF6] to-[#00F2FE] p-[1.5px] shadow-[0_0_16px_rgba(0,242,254,0.35)]">
                <div className="w-full h-full bg-[#0B0E14] rounded-[10px] flex items-center justify-center font-black text-sm text-[#00F2FE]">
                  10A7
                </div>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="font-extrabold text-sm text-white flex items-center gap-1">
                    Lớp 10A7 <Icon name="sparkles" className="w-3.5 h-3.5 text-[#00F2FE]" />
                  </span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-[#00F2FE]/10 text-[#00F2FE] border border-[#00F2FE]/20 font-semibold">
                    Digital Campus Hub
                  </span>
                </div>
                <p className="text-[11px] text-slate-400">Không Gian Trường Học Ảo & Phòng Hoạt Động Trực Tiếp</p>
              </div>
            </div>

            {/* Quick Navigation Links */}
            <div className="flex items-center gap-3">
              <a
                href="community-feed.html"
                className="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-gradient-to-r from-[#00F2FE] to-[#8B5CF6] text-black font-extrabold text-xs shadow-[0_0_12px_rgba(0,242,254,0.3)] hover:scale-105 transition-all"
              >
                <span>Bảng Tin Cộng Đồng 📱</span>
              </a>
              <a
                href="index.html"
                className="hidden sm:inline-flex items-center gap-1 px-3 py-1.5 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300 text-xs border border-white/10 transition-all"
              >
                Trang Chủ Lớp
              </a>
              <div className="hidden md:flex items-center gap-2 bg-[#151A23] px-3 py-1.5 rounded-xl border border-white/10 text-xs">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Online: <strong>24/39</strong></span>
              </div>

              <div className="flex items-center gap-2 bg-[#151A23] px-3 py-1.5 rounded-xl border border-[#8B5CF6]/30 text-xs">
                <Icon name="shield" className="w-3.5 h-3.5 text-[#8B5CF6]" />
                <span className="text-slate-300">Quyền GVCN:</span>
                <button
                  onClick={() => setIsTeacherMode(!isTeacherMode)}
                  className={`text-[10px] font-bold px-2 py-0.5 rounded transition-all ${
                    isTeacherMode ? 'bg-[#8B5CF6] text-white shadow-[0_0_10px_rgba(139,92,246,0.5)]' : 'bg-white/10 text-slate-400'
                  }`}
                >
                  {isTeacherMode ? 'BẬT (Soi Danh Tính)' : 'TẮT'}
                </button>
              </div>
            </div>
          </header>

          {/* 3-Column Layout */}
          <div className="max-w-[1440px] mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-[260px_1fr_340px] gap-6">

            {/* Left Nav */}
            <aside className="hidden lg:flex flex-col gap-5 sticky top-24 h-[calc(100vh-7.5rem)]">
              <button
                onClick={() => setShowModal(true)}
                className="w-full py-3 rounded-2xl bg-gradient-to-r from-[#00F2FE] to-[#8B5CF6] text-black font-extrabold text-xs tracking-wide shadow-[0_0_20px_rgba(0,242,254,0.35)] hover:scale-[1.02] transition-all flex items-center justify-center gap-2"
              >
                <Icon name="plus" className="w-4 h-4" />
                <span>TẠO PHÒNG HOẠT ĐỘNG MỚI</span>
              </button>

              <div className="bg-[#151A23] border border-white/10 rounded-2xl p-3 shadow-xl">
                <p className="text-[10px] uppercase font-bold text-slate-400 px-3 py-1.5">Phân loại phòng</p>
                <div className="flex flex-col gap-1 mt-1 text-xs">
                  {[
                    { id: 'ALL', label: 'Tất Cả Hoạt Động', icon: 'radio' },
                    { id: 'CINEMA', label: 'Rạp Chiếu & Xem Chung', icon: 'tv' },
                    { id: 'GAME', label: 'Cờ Caro 15x15', icon: 'gamepad' },
                    { id: 'LOFI', label: 'Lofi Study Cafe', icon: 'headphones' }
                  ].map(cat => (
                    <button
                      key={cat.id}
                      onClick={() => { setCategoryFilter(cat.id); setCurrentView('LOBBY'); }}
                      className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl font-medium transition-all ${
                        categoryFilter === cat.id ? 'bg-[#00F2FE]/15 text-[#00F2FE] border border-[#00F2FE]/30' : 'text-slate-300 hover:bg-white/5'
                      }`}
                    >
                      <div className="flex items-center gap-2.5">
                        <Icon name={cat.icon} className="w-4 h-4" />
                        <span>{cat.label}</span>
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            </aside>

            {/* Central Stage */}
            <main className="flex flex-col gap-6 min-w-0">
              {currentView === 'ROOM_ACTIVE' && selectedRoom ? (
                <div className="flex flex-col gap-5">
                  <div className="flex items-center justify-between bg-[#151A23] border border-white/10 rounded-2xl p-4 shadow-xl">
                    <div className="flex items-center gap-3">
                      <button
                        onClick={() => { setSelectedRoom(null); setCurrentView('LOBBY'); }}
                        className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/5 hover:bg-white/10 text-xs font-semibold text-slate-300 border border-white/10"
                      >
                        <Icon name="arrowLeft" className="w-4 h-4" /> Về Lobby
                      </button>
                      <div>
                        <h2 className="text-sm font-bold text-white flex items-center gap-2">
                          {selectedRoom.title}
                          <span className="text-[10px] px-2 py-0.5 rounded-full bg-[#00F2FE]/10 text-[#00F2FE] border border-[#00F2FE]/20">
                            {selectedRoom.privacy}
                          </span>
                        </h2>
                        <p className="text-[11px] text-slate-400">Chủ phòng: {selectedRoom.host}</p>
                      </div>
                    </div>

                    <button
                      onClick={() => setDanmakuEnabled(!danmakuEnabled)}
                      className={`px-3 py-1 rounded-xl text-xs font-bold ${
                        danmakuEnabled ? 'bg-[#00F2FE] text-black shadow-[0_0_10px_rgba(0,242,254,0.4)]' : 'bg-white/10 text-slate-400'
                      }`}
                    >
                      Danmaku: {danmakuEnabled ? 'BẬT' : 'TẮT'}
                    </button>
                  </div>

                  {/* Cinema or Caro or Lofi */}
                  {selectedRoom.type === 'CINEMA' && (
                    <div className="relative aspect-video w-full rounded-2xl overflow-hidden bg-black border border-white/10 shadow-2xl">
                      <img src="https://images.unsplash.com/photo-1517048676732-d65bc937f952?w=1200&auto=format&fit=crop&q=80" className="w-full h-full object-cover opacity-85" />
                      {danmakuEnabled && (
                        <div className="absolute inset-0 pointer-events-none overflow-hidden">
                          {danmakuList.map(d => (
                            <div
                              key={d.id}
                              style={{ top: `${d.top}%`, color: d.color, animationDuration: `${d.duration}s` }}
                              className="danmaku-item text-sm font-extrabold drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] px-3 py-1 rounded-full bg-black/40 border border-white/10"
                            >
                              {d.text}
                            </div>
                          ))}
                        </div>
                      )}
                      <div className="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/90 p-4 flex items-center justify-between text-xs">
                        <div className="flex items-center gap-3">
                          <button className="w-9 h-9 rounded-full bg-[#00F2FE] text-black flex items-center justify-center font-bold shadow-lg">
                            <Icon name="play" className="w-4 h-4 fill-black ml-0.5" />
                          </button>
                          <div>
                            <p className="font-bold text-white truncate">{selectedRoom.videoTitle || selectedRoom.title}</p>
                            <p className="text-[10px] text-slate-400">{selectedRoom.videoProgress || 'Đang đồng bộ'}</p>
                          </div>
                        </div>
                        <span className="px-2 py-0.5 rounded bg-rose-500/20 text-rose-400 border border-rose-500/30 text-[10px] font-bold animate-pulse">LIVE SYNC</span>
                      </div>
                    </div>
                  )}

                  {selectedRoom.type === 'GAME_CARO' && (
                    <div className="bg-[#151A23] border border-white/10 rounded-2xl p-5 shadow-2xl flex flex-col items-center">
                      <div className="w-full flex items-center justify-between mb-4 pb-3 border-b border-white/10 text-xs">
                        <span className="font-bold">Lượt đi: Quân {caroTurn}</span>
                        <button onClick={() => setCaroBoard(Array(15).fill(null).map(() => Array(15).fill(null)))} className="px-3 py-1 rounded bg-white/10">Làm mới</button>
                      </div>
                      <div className="overflow-x-auto max-w-full pb-2">
                        <div className="grid grid-cols-15 gap-[1px] bg-slate-700/50 p-[2px] rounded-lg border border-white/10">
                          {caroBoard.map((row, r) =>
                            row.map((cell, c) => (
                              <button
                                key={`${r}-${c}`}
                                onClick={() => handleCellClick(r, c)}
                                className={`w-7 h-7 bg-[#0B0E14] hover:bg-white/5 flex items-center justify-center font-bold text-xs ${
                                  cell === 'X' ? 'text-[#00F2FE]' : cell === 'O' ? 'text-[#8B5CF6]' : ''
                                }`}
                              >
                                {cell}
                              </button>
                            ))
                          )}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              ) : (
                /* LOBBY VIEW */
                <>
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-base font-bold text-white flex items-center gap-2">
                        Lobby Hoạt Động Lớp 10A7 <Icon name="sparkles" className="w-4 h-4 text-[#00F2FE]" />
                      </h2>
                      <p className="text-xs text-slate-400">Khám phá các phòng học tập, rạp chiếu hoặc chơi cờ cùng lớp</p>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {rooms.map(room => (
                      <div key={room.id} className="bg-[#151A23] border border-white/10 rounded-2xl p-4 shadow-xl flex flex-col justify-between hover:border-[#00F2FE]/50 transition-all">
                        <div>
                          <div className="relative aspect-video w-full rounded-xl overflow-hidden mb-3 bg-black/40">
                            <img src={room.thumbnail} className="w-full h-full object-cover" />
                            <div className="absolute top-2 left-2 px-2 py-0.5 rounded-full bg-black/70 backdrop-blur-md border border-white/10 text-[10px] font-bold text-white flex items-center gap-1">
                              {room.isLocked ? <Icon name="lock" className="w-3 h-3 text-rose-400" /> : <Icon name="unlock" className="w-3 h-3 text-emerald-400" />}
                              <span>{room.privacy}</span>
                            </div>
                            <div className="absolute top-2 right-2 px-2 py-0.5 rounded-full bg-black/70 text-[10px] text-slate-200">
                              {room.membersCount}/{room.maxCapacity}
                            </div>
                          </div>
                          <h3 className="text-sm font-bold text-white line-clamp-1 mb-1">{room.title}</h3>
                          <p className="text-[11px] text-slate-400 mb-3">Chủ phòng: {room.host}</p>
                        </div>
                        <div className="pt-3 border-t border-white/5 flex items-center justify-between">
                          <span className="text-[11px] text-emerald-400 font-medium">● Đang hoạt động</span>
                          <button
                            onClick={() => { setSelectedRoom(room); setCurrentView('ROOM_ACTIVE'); }}
                            disabled={room.isLocked}
                            className="px-4 py-1.5 rounded-xl font-bold text-xs bg-gradient-to-r from-[#00F2FE] to-[#8B5CF6] text-black hover:scale-105 transition-all disabled:opacity-40"
                          >
                            {room.isLocked ? 'Khóa tự học' : 'Tham gia ngay'}
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </>
              )}
            </main>

            {/* Right Sidebar: DJ & Chat */}
            <aside className="hidden lg:flex flex-col gap-5 sticky top-24 h-[calc(100vh-7.5rem)]">
              {/* DJ Widget */}
              <div className="bg-[#151A23] border border-white/10 rounded-2xl p-4 shadow-xl">
                <div className="flex items-center justify-between mb-2">
                  <div className="flex items-center gap-2 text-xs font-bold text-white">
                    <Icon name="radio" className="w-4 h-4 text-[#00F2FE]" />
                    <span>Classroom DJ Radio</span>
                  </div>
                  <span className="text-[10px] text-emerald-400 font-mono bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">LIVE</span>
                </div>
                <p className="text-xs font-bold text-white">Lofi Study Chillhop</p>
                <div className="flex items-center justify-between text-xs mt-3">
                  <button onClick={() => setDjPlaying(!djPlaying)} className="px-3 py-1 rounded-xl bg-white/5 border border-white/10 text-slate-200">
                    {djPlaying ? 'Tạm Dừng' : 'Phát Nhạc'}
                  </button>
                  <span className="text-[10px] font-mono text-slate-400">02:15 / 03:45</span>
                </div>
              </div>

              {/* Chat box */}
              <div className="bg-[#151A23] border border-white/10 rounded-2xl p-4 shadow-xl flex-1 flex flex-col min-h-[300px]">
                <div className="flex items-center justify-between mb-2 pb-2 border-b border-white/10 text-xs font-bold text-white">
                  <span>Chat Trực Tiếp Lớp 10A7</span>
                </div>
                <div className="flex-1 overflow-y-auto space-y-2 max-h-56 pr-1">
                  {chatMessages.map(m => (
                    <div key={m.id} className="text-xs bg-[#0B0E14]/60 p-2 rounded-xl border border-white/5">
                      <div className="flex items-center justify-between mb-0.5">
                        <span className="font-bold text-[#00F2FE]">{m.author}</span>
                        <span className="text-[9px] text-slate-500">{m.time}</span>
                      </div>
                      <p className="text-slate-200">{m.text}</p>
                    </div>
                  ))}
                </div>

                <form onSubmit={handleSendChat} className="mt-3 flex items-center gap-2">
                  <input
                    type="text"
                    value={chatInput}
                    onChange={e => setChatInput(e.target.value)}
                    placeholder="Nhắn tin / Danmaku..."
                    className="flex-1 bg-[#0B0E14] border border-white/10 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-[#00F2FE]"
                  />
                  <button type="submit" className="p-2 rounded-xl bg-[#00F2FE] text-black font-bold">
                    <Icon name="send" className="w-3.5 h-3.5" />
                  </button>
                </form>
              </div>
            </aside>
          </div>

          {/* Modal */}
          {showModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#151A23] border border-white/15 rounded-3xl p-6 max-w-md w-full shadow-2xl">
                <div className="flex items-center justify-between mb-4 pb-2 border-b border-white/10">
                  <h3 className="text-base font-bold text-white">Tạo Phòng Mới</h3>
                  <button onClick={() => setShowModal(false)}><Icon name="x" className="w-5 h-5" /></button>
                </div>
                <form onSubmit={handleCreateRoomSubmit} className="flex flex-col gap-3 text-xs">
                  <div>
                    <label className="block font-bold text-slate-300 mb-1">Tên Phòng</label>
                    <input
                      required
                      value={modalTitle}
                      onChange={e => setModalTitle(e.target.value)}
                      placeholder="Nhập tên phòng..."
                      className="w-full bg-[#0B0E14] border border-white/10 rounded-xl p-2.5 text-white"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-300 mb-1">Loại Phòng</label>
                    <select value={modalType} onChange={e => setModalType(e.target.value)} className="w-full bg-[#0B0E14] border border-white/10 rounded-xl p-2.5 text-white">
                      <option value="CINEMA">Rạp Chiếu (Cinema)</option>
                      <option value="GAME_CARO">Cờ Caro 15x15</option>
                      <option value="LOFI_STUDY">Lofi Study Cafe</option>
                    </select>
                  </div>
                  <div className="flex justify-end gap-2 mt-3">
                    <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2 bg-white/10 rounded-xl">Hủy</button>
                    <button type="submit" className="px-4 py-2 bg-gradient-to-r from-[#00F2FE] to-[#8B5CF6] text-black font-bold rounded-xl">Tạo Ngay</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DigitalCampusApp />);
  </script>
</body>
</html>
